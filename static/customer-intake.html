<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSD Customer Information Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1923; font-family: 'Inter', system-ui, sans-serif; color: #e8edf2; min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 20px; font-weight: 700; color: #e8edf2; }
  .header p { font-size: 13px; color: #6b8fa8; margin-top: 4px; }
  .progress { display: flex; gap: 6px; margin-bottom: 24px; }
  .progress .seg { flex: 1; height: 5px; border-radius: 3px; background: #1e2d3d; transition: background .2s; }
  .progress .seg.done { background: #25a35a; }
  .step-label { text-align: center; font-size: 11px; color: #6b8fa8; margin-bottom: 18px; font-weight: 600; letter-spacing: .3px; }
  .card { background: #131f2b; border: 1px solid #1e2d3d; border-radius: 16px; padding: 22px 20px; }
  .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #e8edf2; }
  .card .sub { font-size: 12px; color: #6b8fa8; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #8ab4cc; font-weight: 600; margin-bottom: 5px; }
  .field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=number], .field input[type=date], .field select {
    width: 100%; background: #162130; border: 1px solid #1e2d3d; border-radius: 8px; padding: 10px 12px; color: #e8edf2; font-size: 14px; outline: none; font-family: inherit;
  }
  .field input:focus, .field select:focus { border-color: #25a35a; }
  .field input[type=date] { color-scheme: dark; }
  .other-input input[type=text] {
    width: 100%; background: #162130; border: 1px solid #1e2d3d; border-radius: 8px; padding: 10px 12px; color: #e8edf2; font-size: 14px; outline: none; font-family: inherit;
  }
  .other-input input[type=text]:focus { border-color: #25a35a; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  .check-group { display: flex; flex-direction: column; gap: 10px; }
  .check-item { display: flex; align-items: center; gap: 10px; background: #162130; border: 1px solid #1e2d3d; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .check-item input { width: 18px; height: 18px; accent-color: #25a35a; }
  .check-item span { font-size: 14px; }
  .yn-item { background: #162130; border: 1px solid #1e2d3d; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .yn-item .q { font-size: 13px; margin-bottom: 8px; }
  .yn-opts { display: flex; gap: 10px; }
  .yn-opts label { flex: 1; text-align: center; padding: 8px; border-radius: 8px; border: 1px solid #1e2d3d; font-size: 13px; font-weight: 600; cursor: pointer; color: #8ab4cc; }
  .yn-opts input { display: none; }
  .yn-opts input:checked + span { color: #fff; }
  .yn-opts label.yes:has(input:checked) { background: #1a6b3c; border-color: #25a35a; color: #fff; }
  .yn-opts label.no:has(input:checked) { background: #6b1a1a; border-color: #e05252; color: #fff; }
  .part-title { font-size: 12px; font-weight: 700; color: #25a35a; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px; }
  .part-title:first-child { margin-top: 0; }
  .radio-opt { display: flex; align-items: flex-start; gap: 10px; background: #162130; border: 1px solid #1e2d3d; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .radio-opt input { margin-top: 3px; accent-color: #25a35a; }
  .radio-opt span { font-size: 13px; line-height: 1.4; }
  .fan-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .fan-table th { text-align: left; color: #6b8fa8; font-weight: 600; padding: 6px 4px; font-size: 11px; }
  .fan-table td { padding: 4px; }
  .fan-table input { width: 100%; background: #162130; border: 1px solid #1e2d3d; border-radius: 6px; padding: 7px 8px; color: #e8edf2; font-size: 12px; outline: none; }
  .fan-table input:focus { border-color: #25a35a; }
  .remove-row { background: none; border: none; color: #e05252; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .add-row-btn { margin-top: 10px; background: none; border: 1px dashed #2a3d52; color: #25a35a; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; }
  .confirm-box { background: #0d2218; border: 1px solid #1a6b3c; border-radius: 10px; padding: 14px; font-size: 12px; color: #a8d8bc; line-height: 1.5; margin-bottom: 14px; }
  .confirm-box strong { display: block; color: #e8edf2; margin-bottom: 8px; }
  .confirm-box p { margin-top: 8px; }
  .confirm-box ul { padding-left: 18px; margin-top: 6px; }
  .confirm-box li { margin-bottom: 4px; }
  .info-note { background: #0d2218; border: 1px solid #1a6b3c; border-radius: 10px; padding: 14px; font-size: 12px; color: #a8d8bc; line-height: 1.5; margin-bottom: 14px; }
  .info-note strong { display: block; color: #e8edf2; margin-bottom: 8px; }
  .info-note p { margin-top: 8px; }
  .info-note ul { padding-left: 18px; margin-top: 6px; }
  .info-note li { margin-bottom: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
  .btn-primary { background: linear-gradient(135deg, #1a6b3c, #25a35a); color: #fff; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary { background: #162130; color: #8ab4cc; border: 1px solid #1e2d3d; }
  .error-text { color: #e05252; font-size: 12px; margin-top: 8px; }
  .success { text-align: center; padding: 40px 16px; }
  .success .icon { font-size: 48px; margin-bottom: 12px; }
  .success h2 { font-size: 18px; margin-bottom: 8px; }
  .success p { font-size: 13px; color: #6b8fa8; }
  .other-input { margin-top: 8px; margin-left: 28px; }
  .pin-gate { text-align: center; padding: 10px 4px; }
  .pin-gate p { font-size: 13px; color: #6b8fa8; margin-bottom: 18px; }
  .pin-gate input { width: 100%; max-width: 220px; text-align: center; letter-spacing: 6px; font-size: 22px; background: #162130; border: 1px solid #1e2d3d; border-radius: 10px; padding: 12px; color: #e8edf2; outline: none; margin-bottom: 14px; }
  .pin-gate input:focus { border-color: #25a35a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>PSD Customer Information Form</h1>
    <p>Please complete all sections before your scheduled installation date.</p>
  </div>
  <div id="app"></div>
</div>

<script>
const TOTAL_STEPS = 4;
const STEP_LABELS = ['Farm & Contact Info', 'Operation & Fan Inventory', 'Equipment & Condition Checklist', 'Installation Scheduling'];

let state = {
  step: 1,
  unlocked: sessionStorage.getItem('psd_intake_pin') ? true : false,
  pinInput: '',
  pinError: '',
  verifyingPin: false,
  submitted: false,
  submitting: false,
  errorMsg: '',
  power_company: '',
  gp_account_name: '', gp_account_number: '', first_name: '', last_name: '', phone: '', email: '',
  farm_address: '', city: '', state: '', zip: '', county: '', year_built: '',
  operation_type: '', op_other_text: '',
  total_barns: '', total_fans: '',
  fan_rows: [{ num_fans: '', brand: '', size: '', motor_hp: '', pulley_size: '' }],
  fan_blades_condition: '', fans_mounted_secure: '', shutters_operate: '',
  hardware_no_rust: '', hardware_removable: '',
  belts_inspected: '', spare_belts_onhand: '',
  tensioners_good: '', bearings_good: '', tensioner_option: '',
  motors_upright: '', motor_hardware_accessible: '',
  confirmation_initials: '',
  install_window_from: '', install_window_to: '', flock_cycle_weeks: '', scheduling_restrictions: ''
};

function render() {
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;

  renderInner();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderInner() {
  const root = document.getElementById('app');
  if (!state.unlocked) { root.innerHTML = renderPinGate(); return; }
  if (state.submitted) { root.innerHTML = renderSuccess(); return; }

  let html = '';
  html += '<div class="progress">';
  for (let i = 1; i <= TOTAL_STEPS; i++) html += `<div class="seg ${i <= state.step ? 'done' : ''}"></div>`;
  html += '</div>';
  html += `<div class="step-label">STEP ${state.step} OF ${TOTAL_STEPS} — ${STEP_LABELS[state.step - 1].toUpperCase()}</div>`;
  html += '<div class="card">';
  if (state.step === 1) html += renderStep1();
  if (state.step === 2) html += renderStep2();
  if (state.step === 3) html += renderStep3();
  if (state.step === 4) html += renderStep4();
  if (state.errorMsg) html += `<div class="error-text">${state.errorMsg}</div>`;
  html += '<div class="btn-row">';
  if (state.step > 1) html += `<button class="btn btn-secondary" onclick="goBack()">Back</button>`;
  if (state.step < TOTAL_STEPS) html += `<button class="btn btn-primary" onclick="goNext()">Continue</button>`;
  if (state.step === TOTAL_STEPS) html += `<button class="btn btn-primary" ${state.submitting ? 'disabled' : ''} onclick="submitForm()">${state.submitting ? 'Submitting…' : 'Submit'}</button>`;
  html += '</div>';
  html += '</div>';
  root.innerHTML = html;
}

function renderStep1() {
  return `
    <h2>Farm &amp; Contact Information</h2>
    <div class="sub">Basic details so we can identify your account and location.</div>
    <div class="field"><label>Power Company</label>
      <select id="f-power_company" onchange="update('power_company', this.value)">
        <option value="" ${state.power_company === '' ? 'selected' : ''}>Select power company…</option>
        <option value="Georgia Power" ${state.power_company === 'Georgia Power' ? 'selected' : ''}>Georgia Power</option>
        <option value="Entergy Louisiana" ${state.power_company === 'Entergy Louisiana' ? 'selected' : ''}>Entergy Louisiana</option>
      </select>
    </div>
    <div class="field"><label>Account Name</label><input id="f-gp_account_name" type="text" value="${state.gp_account_name}" oninput="update('gp_account_name', this.value)"></div>
    <div class="field"><label>Account #</label><input id="f-gp_account_number" type="text" value="${state.gp_account_number}" oninput="update('gp_account_number', this.value)"></div>
    <div class="row2">
      <div class="field"><label>First Name</label><input id="f-first_name" type="text" value="${state.first_name}" oninput="update('first_name', this.value)"></div>
      <div class="field"><label>Last Name</label><input id="f-last_name" type="text" value="${state.last_name}" oninput="update('last_name', this.value)"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Phone Number <span style="color:#6b8fa8;font-weight:400;">(optional)</span></label><input id="f-phone" type="tel" inputmode="numeric" placeholder="(555) 555-5555" value="${state.phone}" oninput="updatePhone(this)"></div>
      <div class="field"><label>Email Address</label><input id="f-email" type="text" inputmode="email" autocomplete="email" value="${state.email}" oninput="update('email', this.value)"></div>
    </div>
    <div class="field"><label>Farm Address</label><input id="f-farm_address" type="text" value="${state.farm_address}" oninput="update('farm_address', this.value)"></div>
    <div class="row3">
      <div class="field"><label>City</label><input id="f-city" type="text" value="${state.city}" oninput="update('city', this.value)"></div>
      <div class="field"><label>State</label><input id="f-state" type="text" value="${state.state}" oninput="update('state', this.value)"></div>
      <div class="field"><label>ZIP</label><input id="f-zip" type="text" value="${state.zip}" oninput="update('zip', this.value)"></div>
    </div>
    <div class="row2">
      <div class="field"><label>County</label><input id="f-county" type="text" value="${state.county}" oninput="update('county', this.value)"></div>
      <div class="field"><label>Year Farm Was Built <span style="color:#6b8fa8;font-weight:400;">(optional)</span></label><input id="f-year_built" type="text" inputmode="numeric" pattern="[0-9]*" value="${state.year_built}" oninput="update('year_built', digitsOnly(this.value))"></div>
    </div>
  `;
}

function renderStep2() {
  const opts = [
    ['Broiler', 'Broiler'], ['Breeder', 'Breeder'],
    ['Egg Production', 'Egg Production'], ['Pullet', 'Pullet'], ['Other', 'Other']
  ];
  let html = `<h2>Poultry Operation &amp; Fan Inventory</h2><div class="sub">Tell us about your operation and fan setup.</div>`;
  html += `<div class="field"><label>Type of Poultry Operation</label>
    <select id="f-operation_type" onchange="update('operation_type', this.value)">
      <option value="" ${state.operation_type === '' ? 'selected' : ''}>Select operation type…</option>
      ${opts.map(([val, label]) => `<option value="${val}" ${state.operation_type === val ? 'selected' : ''}>${label}</option>`).join('')}
    </select>
  </div>`;
  if (state.operation_type === 'Other') html += `<div class="field"><label>Please specify</label><input id="f-op_other_text" type="text" value="${state.op_other_text}" oninput="update('op_other_text', this.value)"></div>`;

  html += `
    <div class="row2">
      <div class="field"><label>Total Number of Barns</label><input id="f-total_barns" type="text" inputmode="numeric" pattern="[0-9]*" value="${state.total_barns}" oninput="update('total_barns', digitsOnly(this.value))"></div>
      <div class="field"><label>Total Number of Fans</label><input id="f-total_fans" type="text" inputmode="numeric" pattern="[0-9]*" value="${state.total_fans}" oninput="update('total_fans', digitsOnly(this.value))"></div>
    </div>
    <div class="sub" style="margin-top:10px;">List each unique fan configuration on your farm. Most farms have 1 to 3 different setups.</div>
    <table class="fan-table">
      <thead><tr><th>&#35; Fans</th><th>Brand</th><th>Size (in)</th><th>Motor (HP)</th><th>Pulley (in/AK)</th><th></th></tr></thead>
      <tbody>`;
  state.fan_rows.forEach((row, i) => {
    html += `<tr>
      <td><input id="f-row${i}-num_fans" type="text" inputmode="numeric" pattern="[0-9]*" value="${row.num_fans}" oninput="updateRow(${i}, 'num_fans', this.value)"></td>
      <td><input id="f-row${i}-brand" type="text" value="${row.brand}" oninput="updateRow(${i}, 'brand', this.value)"></td>
      <td><input id="f-row${i}-size" type="text" value="${row.size}" oninput="updateRow(${i}, 'size', this.value)"></td>
      <td><input id="f-row${i}-motor_hp" type="text" value="${row.motor_hp}" oninput="updateRow(${i}, 'motor_hp', this.value)"></td>
      <td><input id="f-row${i}-pulley_size" type="text" value="${row.pulley_size}" oninput="updateRow(${i}, 'pulley_size', this.value)"></td>
      <td>${state.fan_rows.length > 1 ? `<button class="remove-row" onclick="removeRow(${i})">&times;</button>` : ''}</td>
    </tr>`;
  });
  html += `</tbody></table>
    <button class="add-row-btn" onclick="addRow()">+ Add Fan Configuration</button>`;
  html += `<div class="confirm-box" style="margin-top:20px;">
    <strong>Important Pulley Measurement Information</strong>
    <p>IMPORTANT: Pulley sizes reported on this form must be accurate. When listing your pulleys, use the following guidelines: If your current motor pulley is labeled in the format AK-__-5/8 (e.g., AK44-5/8), provide the exact part number as shown. If your pulley is not an AK-series, provide the accurate diameter in inches.</p>
    <p>If incorrect pulley sizes are submitted and product is ordered, a charge of $25.00 per incorrectly specified pulley will apply, and the customer will be responsible for purchasing the correct pulleys. PSD is not responsible for errors in reported pulley specifications. Please measure and verify all pulley sizes carefully before submitting this form.</p>
    <div style="margin-top:12px;"><a href="/Docs/Pulley_Measurement_Guide.pdf" target="_blank" rel="noopener noreferrer" style="color:#25a35a;font-weight:600;">Open Pulley Measurement Guide (PDF)</a></div>
    <iframe src="/Docs/Pulley_Measurement_Guide.pdf" title="Pulley Measurement Guide" style="width:100%;height:360px;border:1px solid #1e2d3d;border-radius:8px;margin-top:10px;background:#162130;"></iframe>
  </div>`;
  return html;
}

function ynQuestion(key, question) {
  return `<div class="yn-item">
    <div class="q">${question}</div>
    <div class="yn-opts">
      <label class="yes"><input type="radio" name="${key}" value="Yes" ${state[key] === 'Yes' ? 'checked' : ''} onchange="update('${key}', 'Yes')"><span>Yes</span></label>
      <label class="no"><input type="radio" name="${key}" value="No" ${state[key] === 'No' ? 'checked' : ''} onchange="update('${key}', 'No')"><span>No</span></label>
    </div>
  </div>`;
}

function renderStep3() {
  let html = `<h2>Equipment &amp; Condition Checklist</h2><div class="sub">Please answer honestly — this helps us plan a smooth installation.</div>`;
  html += `<div class="confirm-box"><strong>Checklist Instructions</strong><p>Please read each item carefully and answer YES or NO honestly. This checklist is used to determine whether PSD can accept your installation. All required conditions must be met before your scheduled service date. If any condition is not resolved in time, PSD reserves the right to postpone or cancel the job.</p></div>`;
  html += `<div class="part-title">Part A — Fan Condition</div>`;
  html += ynQuestion('fan_blades_condition', 'All fan blades are in good condition — no warping or visible damage');
  html += ynQuestion('fans_mounted_secure', 'All fans are securely mounted and structurally sound');
  html += ynQuestion('shutters_operate', 'Fan shutters open and close freely');

  html += `<div class="part-title">Part B — Hardware Condition</div>`;
  html += ynQuestion('hardware_no_rust', 'Hardware (bolts and nuts) shows no heavy rust or corrosion');
  html += ynQuestion('hardware_removable', 'Hardware can be removed without grinding or heavy torquing');
  html += `<div class="confirm-box"><strong>Hardware Fee (Mandatory):</strong><p>Stainless steel hardware (1” bolt and nut per motor) is automatically supplied by PSD at $4.00 per motor and will be invoiced to the customer prior to installation. This fee applies to all projects with no exceptions.</p><p><strong>Rusted or Seized Hardware — Labor Charge</strong><br>If our contractor encounters hardware on site that requires grinding or heavy torquing to remove, a charge of $50.00 per affected motor will be applied for the additional labor. To avoid this charge, we strongly recommend inspecting all hardware before your installation date and removing any motors with problematic hardware ahead of time. Any hardware or materials requested from PSD must be confirmed prior to your installation date so your contractor arrives fully prepared.</p><p><strong>Pre-Installation Motor Removal Requirement</strong><br>In the event that a farm assessment reveals that the majority of fan motors have corroded, rusted, or seized hardware that would prevent standard removal, PSD reserves the right to require that all affected motors be fully removed by the customer prior to the scheduled installation date. If this requirement is communicated to you and motors have not been removed upon arrival of the PSD contractor, the installation will be rescheduled and a trip charge may apply. For isolated cases where only a small number of motors have seized hardware encountered on site, a charge of $50.00 per affected motor will be applied for the additional removal labor.</p></div>`;

  html += `<div class="part-title">Part C — Belts</div>`;
  html += ynQuestion('belts_inspected', 'All belts have been thoroughly inspected prior to submitting this form');
  html += ynQuestion('spare_belts_onhand', 'Spare belts are on hand and ready on the day of installation');
  html += `<div class="confirm-box"><strong>Belt Requirement:</strong><p>Belts are the sole responsibility of the customer. PSD does not supply belts under any circumstances. Please ensure all belts have been inspected and that spare belts are available on site on the day of installation. Motors will not be installed on fans with damaged or improperly sized belts. No exceptions.</p></div>`;

  html += `<div class="part-title">Part D — Tensioners &amp; Bearings</div>`;
  html += ynQuestion('tensioners_good', 'All tensioners are in good working condition');
  html += ynQuestion('bearings_good', 'All bearings are in good condition — no excessive noise or play');

  const tensionerOpts = [
    ['not_applicable', 'Not applicable — all tensioners are in good condition.'],
    ['customer_supply', 'I will supply and replace tensioners prior to the installation date.'],
    ['psd_supply', 'I would like PSD to supply replacement tensioners at an additional cost. A quote will be provided and must be approved before your installation date.']
  ];
  html += `<div style="font-size:13px; margin-bottom:8px;">If tensioners need replacement, please select one option:</div>`;
  tensionerOpts.forEach(([val, label]) => {
    html += `<label class="radio-opt"><input type="radio" name="tensioner_option" value="${val}" ${state.tensioner_option === val ? 'checked' : ''} onchange="update('tensioner_option', '${val}')"><span>${label}</span></label>`;
  });

  html += `<div class="part-title">Part E — Motor Accessibility &amp; Mounting</div>`;
  html += ynQuestion('motors_upright', 'All fan motors are mounted in a standard upright position');
  html += ynQuestion('motor_hardware_accessible', 'All motor hardware and mounting points are fully accessible for removal');
  html += `<div class="confirm-box" style="margin-top:14px;"><strong>Inverted Motor Mounting &amp; Accessibility</strong><p>Some older fan models were built with motors mounted upside down, or in a position where the hardware cannot be easily accessed for removal. PSD will not perform installations where motors are inverted. (Reference Image Below)</p><p>If this applies to your farm, you still have options:</p><ul><li>You may still qualify for Power rebate program.</li><li>Equipment can be purchased directly from PSD at standard pricing.</li><li>Your own contractor performs the installation.</li><li>Once installation is complete, Georgia Power will rebate you directly.</li></ul><p>If you are unsure whether this applies to your farm, please contact your PSD representative before submitting this form.</p><img src="/Images/Motor%20Sample.png" alt="Motor sample reference image" style="max-width:100%;margin-top:10px;border-radius:8px;" onerror="if(this.src.endsWith('.png')){this.src='/Images/Motor%20Sample.jpg';}else if(this.src.endsWith('.jpg')){this.src='/Images/Motor%20Sample.jpeg';}else{this.style.display='none';}"></div>`;

  html += `<div class="part-title">Part F — Overall Readiness Confirmation</div>`;
  html += `<div class="confirm-box">By initialing below, I confirm that I have read and answered this checklist honestly and to the best of my knowledge. I understand that PSD will review this form and reserves the right to accept or decline this project based on the condition of my equipment. I also understand that any unresolved conditions on this checklist may result in postponement or cancellation of the installation, with no obligation on the part of PSD.</div>`;
  html += `<div class="field"><label>Initials (confirms Yes)</label><input id="f-confirmation_initials" type="text" maxlength="6" value="${state.confirmation_initials}" oninput="update('confirmation_initials', this.value)"></div>`;
  return html;
}

function renderStep4() {
  let html = `<h2>Installation Scheduling</h2><div class="sub">Help us plan the right time window for your installation.</div>`;
  html += `<div class="row2">
    <div class="field"><label>Available Installation Window From</label><input id="f-install_window_from" type="date" value="${state.install_window_from}" oninput="update('install_window_from', this.value)"></div>
    <div class="field"><label>Available Installation Window To</label><input id="f-install_window_to" type="date" value="${state.install_window_to}" oninput="update('install_window_to', this.value)"></div>
  </div>`;
  html += `<div class="field"><label>Flock Cycle (weeks between flocks)</label><input id="f-flock_cycle_weeks" type="text" inputmode="numeric" pattern="[0-9]*" value="${state.flock_cycle_weeks}" oninput="update('flock_cycle_weeks', this.value)"></div>`;
  html += `<div class="field"><label>Any Scheduling Restrictions</label><input id="f-scheduling_restrictions" type="text" placeholder="Describe any restrictions, or leave blank if none" value="${state.scheduling_restrictions}" oninput="update('scheduling_restrictions', this.value)"></div>`;
  return html;
}

function renderSuccess() {
  return `<div class="card success">
    <div class="icon">&#9989;</div>
    <h2>Customer Information Form Submitted Successfully</h2>
    <p>Thank you — your information has been received. A PSD team member will follow up if any information needs clarification.</p>
  </div>`;
}

function renderPinGate() {
  return `<div class="card pin-gate">
    <h2>Enter Access PIN</h2>
    <p>Please enter the PIN provided by your PSD representative to access this survey.</p>
    <input id="f-pinInput" type="password" inputmode="numeric" maxlength="8" value="${state.pinInput}" oninput="updatePin(this.value)" onkeydown="if(event.key==='Enter') verifyPin();" autofocus>
    ${state.pinError ? `<div class="error-text">${state.pinError}</div>` : ''}
    <div class="btn-row">
      <button class="btn btn-primary" ${state.verifyingPin ? 'disabled' : ''} onclick="verifyPin()">${state.verifyingPin ? 'Checking…' : 'Unlock'}</button>
    </div>
  </div>`;
}

function updatePin(val) { state.pinInput = val; state.pinError = ''; render(); }

async function verifyPin() {
  if (!state.pinInput) { state.pinError = 'Please enter your PIN.'; render(); return; }
  state.verifyingPin = true; state.pinError = ''; render();
  try {
    const res = await fetch('/customer-intake-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: state.pinInput })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Invalid PIN');
    sessionStorage.setItem('psd_intake_pin', state.pinInput);
    state.unlocked = true;
  } catch (e) {
    state.pinError = e.message || 'Invalid PIN';
  }
  state.verifyingPin = false;
  render();
}

function update(key, val) { state[key] = val; state.errorMsg = ''; render(); }
function updatePhone(input) {
  const raw = input.value;
  const cursor = input.selectionStart || raw.length;
  const formatted = formatPhoneNumber(raw);
  update('phone', formatted);
  const next = document.getElementById('f-phone');
  if (next) {
    next.focus();
    const position = Math.min(cursor + (formatted.length - raw.length), formatted.length);
    next.setSelectionRange(position, position);
  }
}
function updateRow(i, key, val) { state.fan_rows[i][key] = val; render(); }
function addRow() { state.fan_rows.push({ num_fans: '', brand: '', size: '', motor_hp: '', pulley_size: '' }); render(); }
function removeRow(i) { state.fan_rows.splice(i, 1); render(); }

function formatPhoneNumber(value) {
  const digits = value.replace(/\D/g, '').slice(0, 10);
  if (digits.length < 4) return digits;
  if (digits.length < 7) return `(${digits.slice(0, 3)}) ${digits.slice(3)}`;
  return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
}

function digitsOnly(value) { return value.replace(/\D/g, ''); }

function validateStep() {
  if (state.step === 1) {
    const required = ['power_company', 'gp_account_name', 'gp_account_number', 'first_name', 'last_name', 'email', 'farm_address', 'city', 'state', 'zip'];
    if (required.some(k => !state[k])) return 'Please complete all required fields.';
  }
  if (state.step === 2) {
    if (!state.operation_type) return 'Please select a type of poultry operation.';
    if (state.operation_type === 'Other' && !state.op_other_text) return 'Please specify the other operation type.';
    if (!state.total_barns || !state.total_fans) return 'Please enter total barns and total fans.';
  }
  if (state.step === 3) {
    const requiredYN = ['fan_blades_condition', 'fans_mounted_secure', 'shutters_operate', 'hardware_no_rust', 'hardware_removable',
      'belts_inspected', 'spare_belts_onhand', 'tensioners_good', 'bearings_good', 'motors_upright', 'motor_hardware_accessible'];
    if (requiredYN.some(k => !state[k])) return 'Please answer every Yes/No question.';
    if (!state.tensioner_option) return 'Please select a tensioner replacement option.';
    if (!state.confirmation_initials) return 'Please enter your initials to confirm.';
  }
  return '';
}

function goNext() {
  const err = validateStep();
  if (err) { state.errorMsg = err; render(); return; }
  state.step++;
  render();
}
function goBack() { state.step--; state.errorMsg = ''; render(); }

async function submitForm() {
  if (!state.install_window_from || !state.install_window_to || !state.flock_cycle_weeks) {
    state.errorMsg = 'Please complete all installation scheduling fields.'; render(); return;
  }

  state.submitting = true; state.errorMsg = ''; render();
  try {
    const res = await fetch('/submit-customer-form', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({}, state, { access_pin: sessionStorage.getItem('psd_intake_pin') || '' }))
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Submission failed');
    state.submitted = true;
  } catch (e) {
    state.errorMsg = e.message || 'Something went wrong. Please try again.';
  }
  state.submitting = false;
  render();
}

render();
</script>
</body>
</html>
