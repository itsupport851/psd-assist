<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD Sales Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1923; font-family: 'Inter', system-ui, sans-serif; color: #e8edf2; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 3px; }
    textarea::placeholder { color: #3a5a70; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .deal-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .deal-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .deal-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; }
    .deal-table tr:last-child td { border-bottom: none; }
    .deal-table tr:hover td { background: #1a2535; cursor: pointer; }
    .line-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .line-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .line-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; }
    .line-table tr:last-child td { border-bottom: none; }
    .line-table .total-row td { border-top: 2px solid #25a35a; font-weight: 700; color: #25a35a; background: #0d1f15; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .tag-scheduled { background: #1a3a5c; color: #5ab4f0; }
    .tag-won { background: #0d3320; color: #25a35a; }
    .tag-lost { background: #3a1a1a; color: #e05252; }
    .tag-qualified { background: #2a1a3a; color: #a87af0; }
    .map-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: linear-gradient(135deg, #1a6b3c, #25a35a); border-radius: 10px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; margin-top: 8px; }
    .map-btn:hover { opacity: 0.9; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; animation: fadeIn 0.3s ease; }
    .qa-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #162130; border: 1px solid #1e2d3d; border-radius: 10px; color: #e8edf2; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: left; }
    .qa-btn:hover { background: #1e2d3d; border-color: #25a35a; color: #25a35a; }
    .qa-btn .qa-icon { font-size: 16px; flex-shrink: 0; }
    .qa-btn .qa-label { line-height: 1.3; }
    .qa-btn .qa-desc { font-size: 10px; color: #6b8fa8; margin-top: 1px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const MAKE_READ_WEBHOOK = "https://hook.us2.make.com/fbf052s9udk8xv3apxgct1xiptjqfi7s";
    const MAKE_UPDATE_WEBHOOK = "https://hook.us2.make.com/bew0u14lqrsqvc5mgil8s9bjq92an4eo";
    const MAKE_INTAKE_WEBHOOK = "https://hook.us2.make.com/tl8ovivxtbwxq3rwrifg6lhgyn5f6es6";
    const MAP_URL = "https://web-production-0b9c8.up.railway.app/map";

    const QUICK_ACTIONS = [
      { icon: "📋", label: "Open Deals", desc: "View all active deals", message: "Show me all open deals" },
      { icon: "📊", label: "Deal Summary", desc: "Filter by stage", message: null, isStageSelector: true },
      { icon: "🗺", label: "Farm Map", desc: "Plot farms on map", message: "Show scheduled farms on the map", isMap: true },
      { icon: "📍", label: "Farm Clusters", desc: "Find nearby farms", message: "Show me farm clusters to plan installer routes" },
      { icon: "💰", label: "Update Pricing", desc: "Edit line item prices", message: "I want to update line item pricing for a deal" },
      { icon: "➕", label: "Add Line Item", desc: "Add fan to a deal", message: "I want to add a new line item to a deal" },
      { icon: "📝", label: "New Deal", desc: "Create a deal", message: "I want to create a new deal in HubSpot" },
      { icon: "👤", label: "New Contact", desc: "Add a contact", message: "I want to create a new contact in HubSpot" },
      { icon: "📤", label: "Submit Form", desc: "Upload customer PDF", message: null, isUpload: true },
    ];

    const SYSTEM_PROMPT = [
      "You are PSD Sales Assistant, an AI agent for Precision Systems Development (PSD) — a contractor that installs exhaust fan motors on poultry farms under Georgia Power's Commercial Energy Efficiency Program (CEEP).",
      "",
      "You help the sales team with:",
      "1. Submit customer intake forms (PDF or screenshot) to kick off the processing pipeline",
      "2. View and update HubSpot deals and line items (fan motor pricing)",
      "3. Show farm locations on a map for scheduling and cluster analysis",
      "",
      "You have access to these tools:",
      "- get_open_deals: fetch all open deals from HubSpot",
      "- get_line_items: fetch line items for a specific deal (requires deal_id)",
      "- update_line_item: update unit price on a line item (requires line_item_id, unit_price)",
      "- update_deal_amount: update the total amount on a deal (requires deal_id, amount)",
      "- submit_form: submit a customer PDF form (requires file_data as base64, file_name, customer_name, email)",
      "- get_deals_with_addresses: fetch all appointmentscheduled deals with farm addresses — use when asked about farm locations, clusters, distance, scheduling routes, or map",
      "- update_line_item: update unit price on a line item via Railway (requires line_item_id, unit_price)",
      "- update_deal_amount: update deal amount via Railway (requires deal_id, amount)",
      "- add_line_item: add a new fan motor line item to a deal (requires deal_id, name, fan_brand, fan_size, motor_size, quantity, unit_price)",
      "- create_deal: create a new HubSpot deal (requires dealname, gp_account_name, gp_account_number, owner_name, farm_address, city, state, zip, total_fans, total_barns)",
      "- create_contact: create a new HubSpot contact (requires email, firstname, company, phone, address, city, state, zip, owner_name, gp_account_number, optional: deal_id to associate)",
      "",
      "CRITICAL ID RULES:",
      "The HubSpot data returns deals like: {id: 339921027805, properties: {dealname: 'Henderson Broiler Farm - GP 4423019876'}}",
      "- The deal ID is ALWAYS the top-level id field (e.g. 339921027805)",
      "- The GP account number (e.g. 4423019876) is inside the deal name — NOT the deal ID",
      "- NEVER use GP account number or list position as deal ID",
      "",
      "Line items: {id: 335654673094, properties: {name: 'Chore-Time 48in', quantity: 24, price: 0}}",
      "- Line item ID is ALWAYS the top-level id field",
      "",
      "When updating prices:",
      "1. Fetch line items first",
      "2. Update each line item using correct line_item_id",
      "3. Calculate total: sum of (quantity x unit_price) for ALL items",
      "4. Update deal amount with correct deal_id",
      "5. Confirm to sales person",
      "",
      "When the user asks for help, options, menu, or what you can do — respond with SHOW_OPTIONS and a brief intro.",
      "When the user asks about deal summary, deal stages, or wants to filter deals by stage — respond with STAGE_SELECTOR and a brief intro.",
      "When the user asks to show deals for a specific stage in natural language (e.g. show me scheduled deals, show won deals, qualified deals) — call get_open_deals then filter and display only deals matching that stage.",
      "",
      "When displaying deals use: DEALS_TABLE:{\"deals\":[{\"id\":\"339921027805\",\"name\":\"Henderson Broiler Farm\",\"amount\":0,\"stage\":\"appointmentscheduled\",\"total_fans\":48,\"total_barns\":6,\"operation_type\":\"Broiler\"}]}",
      "When displaying line items use: LINE_ITEMS_TABLE:{\"deal_name\":\"Farm\",\"deal_id\":\"123\",\"items\":[{\"id\":\"456\",\"name\":\"Fan\",\"brand\":\"Chore-Time\",\"size\":48,\"qty\":24,\"unit_price\":0,\"line_total\":0}]}",
      "When showing map use: MAP_LINK after summarizing the farms found",
      "",
      "CRITICAL TOOL CALL RULE: When you need to call a tool, your ENTIRE response must be ONLY the JSON object. Zero text before it. Zero text after it. No explanation. No confirmation. Just the raw JSON and nothing else.",
      "",
      "{\"tool\": \"get_open_deals\", \"params\": {}}",
      "{\"tool\": \"get_open_deals\", \"params\": {\"stage\": \"appointmentscheduled\"}}", // optional stage filter: appointmentscheduled, closedwon, closedlost, qualifiedtobuy, presentationscheduled
      "{\"tool\": \"get_line_items\", \"params\": {\"deal_id\": \"339921027805\"}}",
      "{\"tool\": \"update_line_item\", \"params\": {\"line_item_id\": \"335654673094\", \"unit_price\": 450}}",
      "{\"tool\": \"update_deal_amount\", \"params\": {\"deal_id\": \"339921027805\", \"amount\": 9000}}",
      "{\"tool\": \"submit_form\", \"params\": {\"file_data\": \"base64\", \"file_name\": \"form.pdf\", \"customer_name\": \"Farm\", \"email\": \"email@farm.com\"}}",
      "{\"tool\": \"get_deals_with_addresses\", \"params\": {}}",
      "{\"tool\": \"add_line_item\", \"params\": {\"deal_id\": \"123\", \"name\": \"Chore-Time 48in 2HP\", \"fan_brand\": \"Chore-Time\", \"fan_size\": 48, \"motor_size\": 2, \"quantity\": 12, \"unit_price\": 450}}",
      "{\"tool\": \"create_deal\", \"params\": {\"dealname\": \"Farm Name - GP 1234\", \"gp_account_name\": \"Farm Name\", \"gp_account_number\": \"1234\", \"owner_name\": \"John\", \"farm_address\": \"123 Rd\", \"city\": \"Athens\", \"state\": \"GA\", \"zip\": \"30601\", \"total_fans\": 48, \"total_barns\": 6}}",
      "{\"tool\": \"create_contact\", \"params\": {\"email\": \"john@farm.com\", \"firstname\": \"John Smith\", \"company\": \"Farm LLC\", \"phone\": \"555-1234\", \"address\": \"123 Rd\", \"city\": \"Athens\", \"state\": \"GA\", \"zip\": \"30601\", \"owner_name\": \"John Smith\", \"gp_account_number\": \"1234\", \"deal_id\": \"optional\"}}",
      "",
      "After tool result, respond naturally. For get_deals_with_addresses, summarize farms found then end with exactly: MAP_LINK",
      "Always be concise and professional. Speak like a helpful colleague."
    ].join("\n");

    async function callMakeViaProxy(makeUrl, payload) {
      const res = await fetch('/proxy', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: makeUrl, payload }),
      });
      if (!res.ok) throw new Error("Proxy error: " + res.status);
      try { return await res.json(); } catch { return { success: true }; }
    }

    async function callRailway(path) {
      const res = await fetch(path, { method: "GET", headers: { "Content-Type": "application/json" } });
      if (!res.ok) throw new Error("Railway error: " + res.status);
      return await res.json();
    }

    async function executeTool(tool, params) {
      // Read operations → direct HubSpot via Railway (free, no Make credits)
      if (tool === "get_open_deals") {
        var stage = params && params.stage ? "?stage=" + params.stage : "";
        return await callRailway("/hubspot/deals" + stage);
      }
      if (tool === "get_line_items")
        return await callRailway("/hubspot/line-items/" + params.deal_id);
      if (tool === "get_deals_with_addresses")
        return await callRailway("/hubspot/deals-with-addresses");
      // Write operations → Railway HubSpot API (free)
      if (tool === "update_line_item") {
        const res = await fetch("/hubspot/line-items/" + params.line_item_id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ unit_price: params.unit_price })
        });
        return await res.json();
      }
      if (tool === "update_deal_amount") {
        const res = await fetch("/hubspot/deals/" + params.deal_id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: params.amount })
        });
        return await res.json();
      }
      if (tool === "add_line_item") {
        const res = await fetch("/hubspot/line-items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(params)
        });
        return await res.json();
      }
      if (tool === "create_deal") {
        const res = await fetch("/hubspot/deals", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(params)
        });
        return await res.json();
      }
      if (tool === "create_contact") {
        const res = await fetch("/hubspot/contacts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(params)
        });
        return await res.json();
      }
      // Intake form still goes through Make pipeline
      if (tool === "submit_form")
        return await callMakeViaProxy(MAKE_INTAKE_WEBHOOK, params);
      throw new Error("Unknown tool: " + tool);
    }

    async function callClaude(messages) {
      const res = await fetch('/claude', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          system: SYSTEM_PROMPT,
          messages,
        }),
      });
      const data = await res.json();
      return data.content && data.content[0] ? data.content[0].text : "";
    }

    function fmt(n) {
      if (n === null || n === undefined || n === "") return "—";
      return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function DealsTable({ data }) {
      const stageLabel = function(s) {
        var map = { appointmentscheduled: "Scheduled", closedwon: "Won", closedlost: "Lost", qualifiedtobuy: "Qualified", presentationscheduled: "Presentation" };
        return map[s] || s;
      };
      const stageColor = function(s) {
        var map = { appointmentscheduled: "tag-scheduled", closedwon: "tag-won", closedlost: "tag-lost", qualifiedtobuy: "tag-qualified", presentationscheduled: "tag-scheduled" };
        return map[s] || "tag-scheduled";
      };
      var totalFans = data.deals.reduce(function(s, d) { return s + (Number(d.total_fans) || 0); }, 0);
      var totalBarns = data.deals.reduce(function(s, d) { return s + (Number(d.total_barns) || 0); }, 0);
      var totalAmount = data.deals.reduce(function(s, d) { return s + (Number(d.amount) || 0); }, 0);
      return React.createElement("div", null,
        React.createElement("div", { style: { fontSize: 12, color: "#6b8fa8", marginBottom: 6 } }, data.deals.length + " deals"),
        React.createElement("table", { className: "deal-table" },
          React.createElement("thead", null,
            React.createElement("tr", null,
              React.createElement("th", null, "#"),
              React.createElement("th", null, "Deal Name"),
              React.createElement("th", null, "Operation"),
              React.createElement("th", null, "Fans"),
              React.createElement("th", null, "Barns"),
              React.createElement("th", null, "Amount"),
              React.createElement("th", null, "Stage")
            )
          ),
          React.createElement("tbody", null,
            data.deals.map(function(d, i) {
              return React.createElement("tr", { key: d.id },
                React.createElement("td", { style: { color: "#6b8fa8" } }, i + 1),
                React.createElement("td", { style: { fontWeight: 500 } }, d.name),
                React.createElement("td", { style: { color: "#8ab4cc", fontSize: 12 } }, d.operation_type ? d.operation_type.replace(/;/g, ", ") : "—"),
                React.createElement("td", { style: { color: "#25a35a", fontWeight: 600 } }, d.total_fans || "—"),
                React.createElement("td", { style: { color: "#25a35a", fontWeight: 600 } }, d.total_barns || "—"),
                React.createElement("td", null, fmt(d.amount)),
                React.createElement("td", null, React.createElement("span", { className: "tag " + stageColor(d.stage) }, stageLabel(d.stage)))
              );
            }),
            React.createElement("tr", { style: { background: "#0d1f15" } },
              React.createElement("td", { colSpan: 3, style: { textAlign: "right", fontWeight: 700, color: "#25a35a", fontSize: 12 } }, "Totals"),
              React.createElement("td", { style: { fontWeight: 700, color: "#25a35a" } }, totalFans),
              React.createElement("td", { style: { fontWeight: 700, color: "#25a35a" } }, totalBarns),
              React.createElement("td", { style: { fontWeight: 700, color: "#25a35a" } }, fmt(totalAmount)),
              React.createElement("td", null)
            )
          )
        )
      );
    }

    function LineItemsTable({ data }) {
      var total = data.items.reduce(function(sum, item) {
        return sum + (Number(item.qty) * Number(item.unit_price || 0));
      }, 0);
      return React.createElement("div", null,
        React.createElement("div", { style: { fontSize: 12, color: "#6b8fa8", marginBottom: 6 } }, data.deal_name + " — " + data.items.length + " line items"),
        React.createElement("table", { className: "line-table" },
          React.createElement("thead", null,
            React.createElement("tr", null,
              React.createElement("th", null, "Fan"),
              React.createElement("th", null, "Size"),
              React.createElement("th", null, "Qty"),
              React.createElement("th", null, "Unit Price"),
              React.createElement("th", null, "Line Total")
            )
          ),
          React.createElement("tbody", null,
            data.items.map(function(item, i) {
              return React.createElement("tr", { key: item.id || i },
                React.createElement("td", { style: { fontWeight: 500 } }, item.brand),
                React.createElement("td", null, item.size + '"'),
                React.createElement("td", null, item.qty),
                React.createElement("td", null, fmt(item.unit_price)),
                React.createElement("td", null, fmt(Number(item.qty) * Number(item.unit_price || 0)))
              );
            }),
            React.createElement("tr", { className: "total-row" },
              React.createElement("td", { colSpan: 4, style: { textAlign: "right" } }, "Total Contract Value"),
              React.createElement("td", null, fmt(total))
            )
          )
        )
      );
    }

    const STAGE_BUTTONS = [
      { icon: "📋", label: "All Deals", stage: null, message: "Show me all deals with fans, barns, operation type and amounts" },
      { icon: "📅", label: "Scheduled", stage: "appointmentscheduled", message: "Show me all appointment scheduled deals with fans, barns, operation type and amounts" },
      { icon: "🎯", label: "Qualified", stage: "qualifiedtobuy", message: "Show me all qualified to buy deals with fans, barns, operation type and amounts" },
      { icon: "🏆", label: "Won", stage: "closedwon", message: "Show me all closed won deals with fans, barns, operation type and amounts" },
      { icon: "❌", label: "Lost", stage: "closedlost", message: "Show me all closed lost deals with fans, barns, operation type and amounts" },
    ];

    function StageSelector({ onAction }) {
      return React.createElement("div", null,
        React.createElement("div", { style: { fontSize: 13, color: "#8ab4cc", marginBottom: 8 } }, "Which deals do you want to see?"),
        React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
          STAGE_BUTTONS.map(function(s, i) {
            return React.createElement("button", {
              key: i,
              className: "qa-btn",
              style: { flex: "0 0 auto" },
              onClick: function() { onAction(s.message); }
            },
              React.createElement("span", { className: "qa-icon" }, s.icon),
              React.createElement("div", null,
                React.createElement("div", { className: "qa-label" }, s.label)
              )
            );
          })
        )
      );
    }

    function QuickActions({ onAction, onUpload, onStageSelector }) {
      return React.createElement("div", { className: "quick-actions" },
        QUICK_ACTIONS.map(function(a, i) {
          return React.createElement("button", {
            key: i,
            className: "qa-btn",
            onClick: function() {
              if (a.isMap) { window.open(MAP_URL, "_blank"); return; }
              if (a.isUpload) { onUpload(); return; }
              if (a.isStageSelector) { onStageSelector(); return; }
              onAction(a.message);
            }
          },
            React.createElement("span", { className: "qa-icon" }, a.icon),
            React.createElement("div", null,
              React.createElement("div", { className: "qa-label" }, a.label),
              React.createElement("div", { className: "qa-desc" }, a.desc)
            )
          );
        })
      );
    }

    function MessageContent({ content, onAction, onUpload, onStageSelector }) {
      if (content.includes("STAGE_SELECTOR")) {
        var ssParts = content.split("STAGE_SELECTOR");
        return React.createElement("div", null,
          ssParts[0] && React.createElement("div", { style: { marginBottom: 8, whiteSpace: "pre-wrap" } }, ssParts[0].trim()),
          React.createElement(StageSelector, { onAction: onAction }),
          ssParts[1] && React.createElement("div", { style: { marginTop: 8, whiteSpace: "pre-wrap" } }, ssParts[1].trim())
        );
      }

      if (content.includes("SHOW_OPTIONS")) {
        var parts = content.split("SHOW_OPTIONS");
        return React.createElement("div", null,
          parts[0] && React.createElement("div", { style: { marginBottom: 8, whiteSpace: "pre-wrap" } }, parts[0].trim()),
          React.createElement(QuickActions, { onAction: onAction, onUpload: onUpload, onStageSelector: onStageSelector }),
          parts[1] && React.createElement("div", { style: { marginTop: 8, whiteSpace: "pre-wrap" } }, parts[1].trim())
        );
      }

      if (content.includes("DEALS_TABLE:")) {
        var parts2 = content.split("DEALS_TABLE:");
        try {
          var jsonStr = parts2[1].trim().split("\n")[0];
          var data = JSON.parse(jsonStr);
          return React.createElement("div", null,
            parts2[0] && React.createElement("div", { style: { marginBottom: 8 } }, parts2[0].trim()),
            React.createElement(DealsTable, { data: data }),
            parts2[2] && React.createElement("div", { style: { marginTop: 8 } }, parts2[2].trim())
          );
        } catch(e) {
          return React.createElement("div", { style: { whiteSpace: "pre-wrap" } }, content);
        }
      }

      if (content.includes("LINE_ITEMS_TABLE:")) {
        var parts3 = content.split("LINE_ITEMS_TABLE:");
        try {
          var jsonStr2 = parts3[1].trim().split("\n")[0];
          var data2 = JSON.parse(jsonStr2);
          return React.createElement("div", null,
            parts3[0] && React.createElement("div", { style: { marginBottom: 8 } }, parts3[0].trim()),
            React.createElement(LineItemsTable, { data: data2 }),
            parts3[2] && React.createElement("div", { style: { marginTop: 8 } }, parts3[2].trim())
          );
        } catch(e) {
          return React.createElement("div", { style: { whiteSpace: "pre-wrap" } }, content);
        }
      }

      if (content.includes("MAP_LINK")) {
        var parts4 = content.split("MAP_LINK");
        return React.createElement("div", null,
          parts4[0] && React.createElement("div", { style: { whiteSpace: "pre-wrap", marginBottom: 12 } }, parts4[0].trim()),
          React.createElement("a", { href: MAP_URL, target: "_blank", rel: "noopener noreferrer", className: "map-btn" }, "🗺 Open Farm Map"),
          parts4[1] && React.createElement("div", { style: { marginTop: 8, whiteSpace: "pre-wrap" } }, parts4[1].trim())
        );
      }

      return React.createElement("div", { style: { whiteSpace: "pre-wrap", wordBreak: "break-word" } }, content);
    }

    function App() {
      const WELCOME = "Hey! I'm your PSD Sales Assistant. How can I help you today?";

      const [messages, setMessages] = useState([{ role: "assistant", content: WELCOME, display: true, showActions: true }]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [uploadedFile, setUploadedFile] = useState(null);
      const [showActions, setShowActions] = useState(true);
      const [showStageSelector, setShowStageSelector] = useState(false);
      const fileRef = useRef();
      const bottomRef = useRef();

      useEffect(function() {
        bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      function handleFile(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
          var base64 = reader.result.split(",")[1];
          setUploadedFile({ name: file.name, base64: base64, type: file.type });
        };
        reader.readAsDataURL(file);
      }

      function triggerUpload() {
        fileRef.current && fileRef.current.click();
      }

      function triggerStageSelector() {
        setShowActions(false);
        setShowStageSelector(false);
        setMessages(function(prev) {
          return prev.concat([{ role: "assistant", content: "STAGE_SELECTOR", display: true }]);
        });
      }

      async function sendMessage(overrideText) {
        var text = (overrideText || input).trim();
        if (!text && !uploadedFile) return;

        setShowActions(false);

        var userContent = text;
        if (uploadedFile) {
          userContent = text
            ? text + " [Attached: " + uploadedFile.name + "]"
            : "I have a customer form to submit: " + uploadedFile.name;
        }

        var newUserMsg = { role: "user", content: userContent, display: true };
        var updatedMessages = messages.concat([newUserMsg]);
        setMessages(updatedMessages);
        setInput("");
        setLoading(true);

        var apiMessages = updatedMessages
          .filter(function(m) { return m.display; })
          .map(function(m) { return { role: m.role, content: m.content }; });

        if (uploadedFile) {
          apiMessages = apiMessages.map(function(m, i) {
            if (i === apiMessages.length - 1) {
              return Object.assign({}, m, { content: m.content + "\n\n[FILE_DATA: base64=" + uploadedFile.base64 + " file_name=" + uploadedFile.name + "]" });
            }
            return m;
          });
        }

        try {
          var iterMessages = apiMessages.slice();
          var finalResponse = "";

          for (var i = 0; i < 10; i++) {
            var response = await callClaude(iterMessages);
            var toolCall = null;

            try {
              var trimmed = response.trim();
              var jsonMatch = trimmed.match(/\{[\s\S]*"tool"[\s\S]*\}/);
              if (jsonMatch) {
                toolCall = JSON.parse(jsonMatch[0]);
              }
            } catch(e) {}

            if (toolCall) {
              setMessages(function(prev) {
                return prev.concat([{ role: "assistant", content: "Calling " + toolCall.tool.replace(/_/g, " ") + "...", display: true, isThinking: true }]);
              });

              var toolResult;
              try {
                toolResult = await executeTool(toolCall.tool, toolCall.params);
              } catch(err) {
                toolResult = { error: err.message };
              }

              setMessages(function(prev) { return prev.filter(function(m) { return !m.isThinking; }); });

              iterMessages = iterMessages.concat([
                { role: "assistant", content: response },
                { role: "user", content: "Tool result for " + toolCall.tool + ": " + JSON.stringify(toolResult) }
              ]);
            } else {
              finalResponse = response;
              break;
            }
          }

          if (finalResponse) {
            var showActionsAgain = /\bSHOW_OPTIONS\b/.test(finalResponse);
            setMessages(function(prev) {
              return prev.concat([{ role: "assistant", content: finalResponse, display: true }]);
            });
            if (showActionsAgain) setShowActions(true);
          }
        } catch(err) {
          setMessages(function(prev) {
            return prev.concat([{ role: "assistant", content: "Something went wrong: " + err.message, display: true }]);
          });
        }

        setUploadedFile(null);
        if (fileRef.current) fileRef.current.value = "";
        setLoading(false);
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      var displayMessages = messages.filter(function(m) { return m.display; });

      return React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#0f1923" } },

        // Header
        React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 12, padding: "16px 24px", borderBottom: "1px solid #1e2d3d", background: "#0d1520" } },
          React.createElement("div", { style: { width: 38, height: 38, borderRadius: 10, background: "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 700, color: "#fff", flexShrink: 0 } }, "P"),
          React.createElement("div", null,
            React.createElement("div", { style: { fontWeight: 600, fontSize: 15 } }, "PSD Sales Assistant"),
            React.createElement("div", { style: { fontSize: 11, color: "#4a9a6b", marginTop: 1 } }, "● Online — Precision Systems Development")
          ),
          React.createElement("div", { style: { marginLeft: "auto", display: "flex", gap: 8 } },
            React.createElement("button", {
              onClick: function() {
                setShowActions(true);
                setMessages(function(prev) {
                  return prev.concat([{ role: "assistant", content: "SHOW_OPTIONS", display: true }]);
                });
              },
              style: { padding: "7px 14px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 8, color: "#8ab4cc", fontSize: 12, cursor: "pointer" }
            }, "⚡ Options"),
            React.createElement("a", { href: "/map", target: "_blank", style: { padding: "7px 14px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 8, color: "#8ab4cc", fontSize: 12, textDecoration: "none" } }, "🗺 Map")
          )
        ),

        // Messages
        React.createElement("div", { style: { flex: 1, overflowY: "auto", padding: "24px 16px", display: "flex", flexDirection: "column", gap: 16 } },
          displayMessages.map(function(msg, i) {
            var isLast = i === displayMessages.length - 1;
            return React.createElement("div", { key: i },
              React.createElement("div", { style: { display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start" } },
                msg.role === "assistant" && React.createElement("div", { style: { width: 28, height: 28, borderRadius: 8, flexShrink: 0, background: msg.isThinking ? "linear-gradient(135deg, #1a4a6b, #256a9a)" : "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#fff", marginRight: 10, marginTop: 2 } }, msg.isThinking ? "⚙" : "P"),
                React.createElement("div", { style: { maxWidth: "80%", padding: "10px 14px", borderRadius: msg.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px", background: msg.role === "user" ? "#1a6b3c" : msg.isThinking ? "#0d1f2d" : "#162130", fontSize: 14, lineHeight: 1.6, color: msg.isThinking ? "#6b8fa8" : "#e8edf2", border: msg.role === "user" ? "none" : "1px solid #1e2d3d", fontStyle: msg.isThinking ? "italic" : "normal" } },
                  msg.isThinking ? msg.content : React.createElement(MessageContent, { content: msg.content, onAction: sendMessage, onUpload: triggerUpload, onStageSelector: triggerStageSelector })
                )
              ),
              // Show quick actions below welcome or when triggered
              msg.role === "assistant" && isLast && showActions && !msg.isThinking &&
                React.createElement("div", { style: { marginLeft: 38, marginTop: 8 } },
                  React.createElement(QuickActions, { onAction: sendMessage, onUpload: triggerUpload, onStageSelector: triggerStageSelector })
                )
            );
          }),

          loading && !messages.some(function(m) { return m.isThinking; }) &&
            React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
              React.createElement("div", { style: { width: 28, height: 28, borderRadius: 8, background: "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#fff" } }, "P"),
              React.createElement("div", { style: { display: "flex", gap: 5, padding: "10px 14px", background: "#162130", borderRadius: "16px 16px 16px 4px", border: "1px solid #1e2d3d" } },
                [0,1,2].map(function(j) {
                  return React.createElement("div", { key: j, style: { width: 7, height: 7, borderRadius: "50%", background: "#25a35a", animation: "bounce 1.2s infinite", animationDelay: (j * 0.2) + "s" } });
                })
              )
            ),
          React.createElement("div", { ref: bottomRef })
        ),

        // File preview
        uploadedFile && React.createElement("div", { style: { margin: "0 16px 8px", padding: "8px 12px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 13 } },
          React.createElement("span", null, "📎 " + uploadedFile.name),
          React.createElement("button", { onClick: function() { setUploadedFile(null); }, style: { background: "none", border: "none", color: "#e05252", cursor: "pointer", fontSize: 16 } }, "×")
        ),

        // Input
        React.createElement("div", { style: { padding: "12px 16px 20px", borderTop: "1px solid #1e2d3d", background: "#0d1520", display: "flex", gap: 10, alignItems: "flex-end" } },
          React.createElement("button", { onClick: triggerUpload, style: { width: 40, height: 40, borderRadius: 10, border: "1px solid #1e2d3d", background: uploadedFile ? "#1a6b3c" : "#162130", color: uploadedFile ? "#fff" : "#6b8fa8", cursor: "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } }, "📎"),
          React.createElement("input", { ref: fileRef, type: "file", accept: ".pdf,image/*", onChange: handleFile, style: { display: "none" } }),
          React.createElement("textarea", {
            value: input,
            onChange: function(e) { setInput(e.target.value); },
            onKeyDown: handleKey,
            placeholder: "Ask me anything or use the quick actions above...",
            rows: 1,
            style: { flex: 1, resize: "none", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 12, padding: "10px 14px", color: "#e8edf2", fontSize: 14, lineHeight: 1.5, outline: "none", fontFamily: "inherit", maxHeight: 120, overflowY: "auto" }
          }),
          React.createElement("button", {
            onClick: function() { sendMessage(); },
            disabled: loading || (!input.trim() && !uploadedFile),
            style: { width: 40, height: 40, borderRadius: 10, border: "none", background: loading || (!input.trim() && !uploadedFile) ? "#162130" : "linear-gradient(135deg, #1a6b3c, #25a35a)", color: loading || (!input.trim() && !uploadedFile) ? "#3a5a70" : "#fff", cursor: loading || (!input.trim() && !uploadedFile) ? "not-allowed" : "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }
          }, "➤")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
