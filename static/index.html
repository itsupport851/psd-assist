<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD Sales Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1923; font-family: 'Inter', system-ui, sans-serif; color: #e8edf2; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 3px; }
    textarea::placeholder { color: #3a5a70; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .deal-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .deal-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .deal-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; }
    .deal-table tr:last-child td { border-bottom: none; }
    .deal-table tr:hover td { background: #1a2535; }
    .line-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .line-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .line-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; }
    .line-table tr:last-child td { border-bottom: none; }
    .line-table .total-row td { border-top: 2px solid #25a35a; font-weight: 700; color: #25a35a; background: #0d1f15; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .tag-scheduled { background: #1a3a5c; color: #5ab4f0; }
    .tag-won { background: #0d3320; color: #25a35a; }
    .tag-lost { background: #3a1a1a; color: #e05252; }
    .tag-qualified { background: #2a1a3a; color: #a87af0; }
    .tag-svc-new { background: #1a2535; color: #8ab4cc; }
    .tag-svc-inprogress { background: #1a3a5c; color: #5ab4f0; }
    .tag-svc-closed { background: #0d3320; color: #25a35a; }
    .tag-svc-ontrack { background: #0d3320; color: #25a35a; }
    .tag-svc-atrisk { background: #2a1a00; color: #f59e0b; }
    .tag-svc-behind { background: #3a1a1a; color: #e05252; }
    .tag-svc-complete { background: #0d2030; color: #5ab4f0; }
    .svc-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .svc-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .svc-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; vertical-align: middle; }
    .svc-table tr:last-child td { border-bottom: none; }
    .svc-table tr:hover td { background: #1a2535; }
    .svc-form-title { font-size: 13px; font-weight: 600; color: #8ab4cc; margin-bottom: 12px; }
    .svc-form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .svc-form-label { font-size: 11px; color: #6b8fa8; font-weight: 500; }
    .svc-form-input { background: #162130; border: 1px solid #1e2d3d; border-radius: 8px; padding: 7px 10px; color: #e8edf2; font-size: 13px; outline: none; font-family: inherit; }
    .svc-form-input:focus { border-color: #25a35a; }
    .svc-form-select { background: #162130; border: 1px solid #1e2d3d; border-radius: 8px; padding: 7px 10px; color: #e8edf2; font-size: 13px; outline: none; font-family: inherit; }
    .svc-form-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #1a6b3c, #25a35a); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .svc-form-btn:hover { opacity: 0.9; }
    .svc-form-btn-cancel { width: 100%; padding: 8px; background: none; border: 1px solid #1e2d3d; border-radius: 8px; color: #6b8fa8; font-size: 12px; cursor: pointer; margin-top: 6px; }
    .map-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: linear-gradient(135deg, #1a6b3c, #25a35a); border-radius: 10px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; margin-top: 8px; }
    .map-btn:hover { opacity: 0.9; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; animation: fadeIn 0.3s ease; }
    .qa-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #162130; border: 1px solid #1e2d3d; border-radius: 10px; color: #e8edf2; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: left; }
    .qa-btn:hover { background: #1e2d3d; border-color: #25a35a; color: #25a35a; }
    .qa-btn .qa-icon { font-size: 16px; flex-shrink: 0; }
    .qa-btn .qa-label { line-height: 1.3; }
    .qa-btn .qa-desc { font-size: 10px; color: #6b8fa8; margin-top: 1px; }
    .pin-key { width: 72px; height: 56px; background: #162130; border: 1px solid #1e2d3d; border-radius: 12px; color: #e8edf2; font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; }
    .pin-key:hover { background: #1e2d3d; border-color: #25a35a; }
    .pin-key:active { transform: scale(0.95); }
    .pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #3a5a70; transition: all 0.2s; }
    .pin-dot.filled { background: #25a35a; border-color: #25a35a; }
    .pin-dot.error { background: #e05252; border-color: #e05252; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const MAKE_INTAKE_WEBHOOK = "https://hook.us2.make.com/tl8ovivxtbwxq3rwrifg6lhgyn5f6es6";
    const MAKE_UPDATE_WEBHOOK = "https://hook.us2.make.com/bew0u14lqrsqvc5mgil8s9bjq92an4eo";
    const MAP_URL = "https://web-production-0b9c8.up.railway.app/map";

    // Role-based quick actions
    const ALL_ACTIONS = [
      // ── Sales ──
      { icon: "📊", label: "Deal Summary",   desc: "Filter by stage",          message: null, isStageSelector: true,        roles: ["sales","analyst","admin"] },
      { icon: "📋", label: "Open Deals",     desc: "View all active deals",    message: "Show me all open deals",            roles: ["sales","analyst","admin","installer"] },
      { icon: "➕", label: "Add Line Item",  desc: "Add fan to a deal",        message: "I want to add a new line item to a deal", roles: ["sales","admin"] },
      { icon: "💰", label: "Update Pricing", desc: "Edit line item prices",    message: "I want to update line item pricing for a deal", roles: ["sales","admin"] },
      { icon: "📝", label: "New Deal",       desc: "Create a deal",            message: "I want to create a new deal in HubSpot", roles: ["sales","admin"] },
      { icon: "👤", label: "New Contact",    desc: "Add a contact",            message: "I want to create a new contact in HubSpot", roles: ["sales","admin"] },
      { icon: "📤", label: "Submit Form",    desc: "Upload customer PDF",      message: null, isUpload: true,               roles: ["sales","admin"] },
      // ── Operations ──
      { icon: "📈", label: "Services Summary", desc: "Filter by stage/status", message: null, isServiceStageSelector: true, roles: ["analyst","admin","operations","installer"] },
      { icon: "🔧", label: "Open Services",  desc: "All active services",      message: "Show me all open services", isServiceAction: true, roles: ["analyst","admin","operations","installer"] },
      { icon: "🔩", label: "New Service",    desc: "Create service for deal",  message: null, isNewServiceForm: true, roles: ["admin"] },
      { icon: "🗺",  label: "Farm Map",       desc: "Plot farms by stage",      message: null, isMap: true, roles: ["analyst","admin","operations"] },
    ];

    const STAGE_BUTTONS = [
      { icon: "📋", label: "All Deals",    message: "Show me all deals with fans, barns, operation type and amounts" },
      { icon: "📅", label: "Scheduled",    message: "Show me all deals with stage appointmentscheduled — include fans, barns, operation type and amounts" },
      { icon: "🎯", label: "Qualified",    message: "Show me all deals with stage qualifiedtobuy — include fans, barns, operation type and amounts" },
      { icon: "🏆", label: "Won",          message: "Show me all deals with stage closedwon — include fans, barns, operation type and amounts" },
      { icon: "❌", label: "Lost",         message: "Show me all deals with stage closedlost — include fans, barns, operation type and amounts" },
    ];

    const SERVICE_STAGE_BUTTONS = [
      { icon: "🔧", label: "All Services", message: "Show me all open services" },
      { icon: "🆕", label: "New", message: "Show me all services with stage new" },
      { icon: "⚙️", label: "In Progress", message: "Show me all services with stage in progress" },
      { icon: "✅", label: "Closed", message: "Show me all services with stage closed" },
      { icon: "🟢", label: "On Track", message: "Show me all services with status on track" },
      { icon: "🟡", label: "At Risk", message: "Show me all services with status at risk" },
      { icon: "🔴", label: "Behind", message: "Show me all services with status behind" },
    ];

    const MAP_STAGE_BUTTONS = [
      { icon: "🗺",  label: "All Deals",    stage: "",                     color: "#6366f1" },
      { icon: "📅", label: "Scheduled",    stage: "appointmentscheduled",  color: "#a855f7" },
      { icon: "🎯", label: "Qualified",    stage: "qualifiedtobuy",        color: "#f59e0b" },
      { icon: "📊", label: "Presentation", stage: "presentationscheduled", color: "#3b82f6" },
      { icon: "🤝", label: "Decision",     stage: "decisionmakerboughtin", color: "#ef4444" },
      { icon: "📄", label: "Contract",     stage: "contractsent",          color: "#06b6d4" },
      { icon: "🏆", label: "Won",          stage: "closedwon",             color: "#10b981" },
    ]; // end MAP_STAGE_BUTTONS

    // ── System Prompt ────────────────────────────────────────
    function getSystemPrompt(role, teamId) {
      const baseTools = [
        "- get_open_deals: fetch all open deals (optional stage filter)",
        "- get_line_items: fetch line items for a specific deal (requires deal_id)",
        "- get_deals_with_addresses: fetch appointmentscheduled deals with farm addresses for map",
        "- get_services: get services for a specific deal (requires deal_id)",
        "- get_all_services: fetch ALL services across all deals (no params needed).",
        "- inspect_service: fetch ALL raw HubSpot properties for one service (requires service_id). Use this when name/team/status are blank to find correct field names.",
        "- get_teams: fetch all HubSpot teams",
      ];
      const salesTools = [
        "- update_line_item: update unit price (requires line_item_id, unit_price)",
        "- update_deal: update deal properties — amount, dealstage, dealname (requires deal_id)",
        "- add_line_item: add new line item to deal (requires deal_id, name, fan_brand, fan_size, motor_size, quantity, unit_price)",
        "- create_deal: create new HubSpot deal",
        "- create_contact: create new HubSpot contact (optional deal_id to associate)",
        "- create_service: create service for appointmentscheduled deal only (requires deal_id, name, description, optional: stage, status, start_date, target_end_date, total_cost, team_id)",
        
        "- repair_service: update a service's name in HubSpot (requires service_id, name). Use when a service has a blank name.",
      ];

      var portalPath = window.location.pathname;
      if (portalPath.length > 1 && portalPath.endsWith('/')) portalPath = portalPath.slice(0, -1);
      var isOpPortal  = portalPath === '/operations';
      var isSalePortal = portalPath === '/sales';
      var isSvcPortal  = portalPath === '/service';

      var tools = (role === "sales" || role === "admin") && !isOpPortal && !isSvcPortal
        ? baseTools.concat(salesTools)
        : baseTools;

      var roleDesc = isOpPortal
        ? "You are helping the PSD operations team. You can view deals, services, and farm map. You cannot create or update deals, contacts, or pricing."
        : isSvcPortal
        ? "You are helping a PSD field installer from team ID " + teamId + ". Show only services/deals assigned to team ID " + teamId + ". No create or update operations."
        : role === "admin"
        ? "You are helping the PSD admin. Full access to all records, deals, services, pricing, and operations."
        : role === "sales"
        ? "You are helping the PSD sales team. Full access to view and create/update all HubSpot records."
        : role === "operations"
        ? "You are helping the PSD operations team. You can view deals, services, and farm map. You cannot create or update deals, contacts, or pricing."
        : role === "analyst"
        ? "You are helping a PSD analyst. View-only. Do NOT show pricing, amounts, or unit prices."
        : "You are helping a PSD field installer from team ID " + teamId + ". Show only services/deals for team ID " + teamId + ". No create or update operations.";

      return [
        "You are PSD Sales Assistant for Precision Systems Development (PSD).",
        roleDesc,
        "",
        "Available tools:",
        tools.join("\n"),
        "",
        "CRITICAL ID RULES:",
        "- Deal ID is ALWAYS the top-level numeric id field (e.g. 339921027805)",
        "- GP account number inside dealname is NOT the deal ID",
        "- Line item ID is ALWAYS the top-level id field",
        "",
        "HubSpot deal stage IDs (use these exactly when calling get_open_deals with a stage param):",
        "- appointmentscheduled = Appointment Scheduled / Scheduled",
        "- qualifiedtobuy = Qualified to Buy / Qualified",
        "- presentationscheduled = Presentation Scheduled",
        "- decisionmakerboughtin = Decision Maker Bought In",
        "- contractsent = Contract Sent",
        "- closedwon = Closed Won / Won",
        "- closedlost = Closed Lost / Lost",
        "",
        "When updating prices: fetch line items → update each → calculate total (sum qty x unit_price) → update deal amount → confirm.",
        "When showing map: call get_deals_with_addresses then end response with MAP_LINK.",
        "When user asks for options/help/menu: respond with SHOW_OPTIONS.",
        "When user asks for deal summary by stage: respond with STAGE_SELECTOR.",
        "When user asks for open services or services summary: call get_all_services then respond with SERVICES_TABLE. If any service has a blank name, immediately call repair_service with a name derived from deal_name (e.g. 'Fan Motor Installation — {deal_name}'), then show updated table.",
        "When user asks for service summary by stage/status: respond with SERVICE_STAGE_SELECTOR.",
        "",
        "Display formats:",
        "DEALS_TABLE:{\"deals\":[{\"id\":\"123\",\"name\":\"Farm\",\"amount\":0,\"stage\":\"appointmentscheduled\",\"total_fans\":48,\"total_barns\":6,\"operation_type\":\"Broiler\"}]}",
        "LINE_ITEMS_TABLE:{\"deal_name\":\"Farm\",\"deal_id\":\"123\",\"items\":[{\"id\":\"456\",\"name\":\"Fan\",\"brand\":\"Chore-Time\",\"size\":48,\"qty\":24,\"unit_price\":0,\"line_total\":0}]}",
        "SERVICES_TABLE:{\"services\":[{\"id\":\"123\",\"name\":\"Fan Motor Installation — Farm\",\"deal_name\":\"Henderson Broiler Farm\",\"stage\":\"new\",\"status\":\"ON_TRACK\",\"team\":\"Team Name\",\"start_date\":\"2026-04-01\",\"due_date\":\"2026-04-30\",\"total_cost\":\"9600\"}]}",
        "TEAMS_SELECTOR:{\"teams\":[{\"id\":\"123\",\"name\":\"Team Name\",\"userIds\":[]}]}",
        "SERVICE_FORM:{\"deal_id\":\"123\",\"deal_name\":\"Farm\",\"team_id\":\"456\",\"team_name\":\"Boxy Services\",\"name\":\"Fan Motor Installation — Farm\",\"description\":\"Install 48 fans across 6 barns\",\"start_date\":\"2026-04-01\",\"target_end_date\":\"2026-04-30\",\"total_cost\":\"9600\",\"stage\":\"new\",\"status\":\"ON_TRACK\"}",
        "MAP_LINK (at end of response after summarizing farms)",
        "SHOW_OPTIONS (when showing menu)",
        "STAGE_SELECTOR (when showing deal stage filter)",
        "SERVICE_STAGE_SELECTOR (when showing service stage/status filter)",
        "",
        "CRITICAL: When calling a tool, respond with ONLY the JSON — no text before or after:",
        "CRITICAL: In your final response after receiving tool results, NEVER repeat or show the tool call JSON, tool name, or raw tool result data. Only show the formatted display output (DEALS_TABLE, SERVICES_TABLE, etc.) or a natural language summary.",
        "{\"tool\": \"get_open_deals\", \"params\": {}}",
        "{\"tool\": \"get_open_deals\", \"params\": {\"stage\": \"appointmentscheduled\"}}",
        "{\"tool\": \"get_line_items\", \"params\": {\"deal_id\": \"339921027805\"}}",
        "{\"tool\": \"update_line_item\", \"params\": {\"line_item_id\": \"335654673094\", \"unit_price\": 450}}",
        "{\"tool\": \"update_deal\", \"params\": {\"deal_id\": \"339921027805\", \"amount\": 9000}}",
        "{\"tool\": \"update_deal\", \"params\": {\"deal_id\": \"339921027805\", \"dealstage\": \"closedwon\"}}",
        "{\"tool\": \"add_line_item\", \"params\": {\"deal_id\": \"123\", \"name\": \"Chore-Time 48in\", \"fan_brand\": \"Chore-Time\", \"fan_size\": 48, \"motor_size\": 2, \"quantity\": 12, \"unit_price\": 0}}",
        "{\"tool\": \"create_deal\", \"params\": {\"dealname\": \"Farm - GP 1234\", \"gp_account_name\": \"Farm\", \"gp_account_number\": \"1234\", \"owner_name\": \"John\", \"farm_address\": \"123 Rd\", \"city\": \"Athens\", \"state\": \"GA\", \"zip\": \"30601\", \"total_fans\": 48, \"total_barns\": 6}}",
        "{\"tool\": \"create_contact\", \"params\": {\"email\": \"john@farm.com\", \"firstname\": \"John Smith\", \"company\": \"Farm LLC\", \"phone\": \"555-1234\", \"address\": \"123 Rd\", \"city\": \"Athens\", \"state\": \"GA\", \"zip\": \"30601\", \"owner_name\": \"John Smith\", \"gp_account_number\": \"1234\"}}",
        "{\"tool\": \"get_services\", \"params\": {\"deal_id\": \"339921027805\"}}",
        "{\"tool\": \"get_all_services\", \"params\": {}}",
        "{\"tool\": \"inspect_service\", \"params\": {\"service_id\": \"825721437925\"}}",
        "{\"tool\": \"repair_service\", \"params\": {\"service_id\": \"825721437925\", \"name\": \"Fan Motor Installation — Henderson Broiler Farm\"}}",
        "{\"tool\": \"get_teams\", \"params\": {}}",
        
        "{\"tool\": \"create_service\", \"params\": {\"deal_id\": \"339921027805\", \"name\": \"Fan Motor Installation\", \"description\": \"Install fans\", \"stage\": \"new\", \"status\": \"ON_TRACK\", \"start_date\": \"2026-04-01\", \"target_end_date\": \"2026-04-30\", \"total_cost\": \"9600\", \"team_id\": \"369709672\"}}",
        "{\"tool\": \"get_deals_with_addresses\", \"params\": {}}",
        "{\"tool\": \"submit_form\", \"params\": {\"file_data\": \"base64\", \"file_name\": \"form.pdf\", \"customer_name\": \"Farm\", \"email\": \"email@farm.com\"}}",
        "",
        "Always be concise and professional. Speak like a helpful colleague."
      ].join("\n");
    }

    async function callRailway(path) {
      const res = await fetch(path, { method: "GET", headers: { "Content-Type": "application/json" } });
      if (!res.ok) throw new Error("Error: " + res.status);
      return await res.json();
    }

    async function callMakeViaProxy(makeUrl, payload) {
      const res = await fetch('/proxy', { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: makeUrl, payload }) });
      if (!res.ok) throw new Error("Proxy error: " + res.status);
      try { return await res.json(); } catch { return { success: true }; }
    }

    async function executeTool(tool, params) {
      if (tool === "get_open_deals") {
        var stage = params && params.stage ? "?stage=" + params.stage : "";
        return await callRailway("/hubspot/deals" + stage);
      }
      if (tool === "get_line_items") return await callRailway("/hubspot/line-items/" + params.deal_id);
      if (tool === "get_deals_with_addresses") return await callRailway("/hubspot/deals-with-addresses");
      if (tool === "get_services") return await callRailway("/hubspot/services/" + params.deal_id);
      if (tool === "get_all_services") return await callRailway("/hubspot/all-services");
      if (tool === "inspect_service") return await callRailway("/hubspot/service-inspect/" + params.service_id);
      if (tool === "repair_service") {
        var res = await fetch("/hubspot/services/" + params.service_id + "/repair", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: params.name }) });
        return await res.json();
      }
      if (tool === "get_teams") return await callRailway("/hubspot/teams");
      if (tool === "update_line_item") {
        const res = await fetch("/hubspot/line-items/" + params.line_item_id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ unit_price: params.unit_price }) });
        return await res.json();
      }
      if (tool === "update_deal_amount" || tool === "update_deal") {
        const res = await fetch("/hubspot/deals/" + params.deal_id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params) });
        return await res.json();
      }
      if (tool === "add_line_item") {
        const res = await fetch("/hubspot/line-items", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params) });
        return await res.json();
      }
      if (tool === "create_deal") {
        const res = await fetch("/hubspot/deals", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params) });
        return await res.json();
      }
      if (tool === "create_contact") {
        const res = await fetch("/hubspot/contacts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params) });
        return await res.json();
      }
      if (tool === "create_service") {
        const res = await fetch("/hubspot/services", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params) });
        return await res.json();
      }

      if (tool === "submit_form") return await callMakeViaProxy(MAKE_INTAKE_WEBHOOK, params);
      throw new Error("Unknown tool: " + tool);
    }

    async function callClaude(messages, role, teamId) {
      const res = await fetch('/claude', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1500, system: getSystemPrompt(role, teamId), messages })
      });
      const data = await res.json();
      return data.content && data.content[0] ? data.content[0].text : "";
    }

    function fmt(n) {
      if (n === null || n === undefined || n === "") return "—";
      return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function DealsTable({ data, role }) {
      const stageLabel = function(s) {
        var map = { appointmentscheduled: "Scheduled", closedwon: "Won", closedlost: "Lost", qualifiedtobuy: "Qualified", presentationscheduled: "Presentation" };
        return map[s] || s;
      };
      const stageColor = function(s) {
        var map = { appointmentscheduled: "tag-scheduled", closedwon: "tag-won", closedlost: "tag-lost", qualifiedtobuy: "tag-qualified", presentationscheduled: "tag-scheduled" };
        return map[s] || "tag-scheduled";
      };

    // ── PIN Screen ──────────────────────────────────────────────
    function PinScreen({ onAuth }) {
      const [pin, setPin] = useState("");
      const [error, setError] = useState(false);
      const [loading, setLoading] = useState(false);
      const portal = getPortalConfig();

      async function submitPin(p) {
        if (p.length < 4) return;
        setLoading(true);
        try {
          const res = await fetch('/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: p }) });
          const data = await res.json();
          if (data.success) {
            // Check role is allowed on this portal
            if (!portal.allowedRoles.includes(data.role)) {
              setError(true);
              setTimeout(function() { setError(false); setPin(""); }, 1000);
            } else {
              onAuth(data.role, data.name, data.team_id || null);
            }
          } else {
            setError(true);
            setTimeout(function() { setError(false); setPin(""); }, 1000);
          }
        } catch(e) {
          setError(true);
          setTimeout(function() { setError(false); setPin(""); }, 1000);
        }
        setLoading(false);
      }

      function pressKey(k) {
        if (loading) return;
        if (k === "del") { setPin(function(p) { return p.slice(0, -1); }); return; }
        var newPin = pin + k;
        setPin(newPin);
        if (newPin.length >= 6) submitPin(newPin);
      }

      var dots = [0,1,2,3,4,5].map(function(i) {
        return React.createElement("div", { key: i, className: "pin-dot" + (i < pin.length ? (error ? " error" : " filled") : ""), style: error ? { animation: "shake 0.3s ease" } : {} });
      });

      var keys = [["1","2","3"],["4","5","6"],["7","8","9"],["del","0","✓"]];

      return React.createElement("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100vh", background: "#0f1923", gap: 32 } },
        React.createElement("div", { style: { textAlign: "center" } },
          React.createElement("div", { style: { width: 56, height: 56, borderRadius: 14, background: "linear-gradient(135deg, #1a4a2a, " + portal.accentColor + ")", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, fontWeight: 700, color: "#fff", margin: "0 auto 16px" } }, "P"),
          React.createElement("div", { style: { fontSize: 20, fontWeight: 700, marginBottom: 4 } }, portal.title),
          React.createElement("div", { style: { fontSize: 13, color: "#6b8fa8" } }, portal.subtitle),
          React.createElement("div", { style: { fontSize: 11, color: "#3a5a70", marginTop: 6 } }, "Enter your PIN to continue")
        ),
        React.createElement("div", { style: { display: "flex", gap: 12, alignItems: "center" } }, dots),
        error && React.createElement("div", { style: { fontSize: 12, color: "#e05252" } }, "Invalid PIN for this portal"),
        React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(3, 72px)", gap: 10 } },
          keys.map(function(row, ri) {
            return row.map(function(k, ki) {
              return React.createElement("button", { key: ri + "-" + ki, className: "pin-key",
                onClick: function() { pressKey(k); },
                style: k === "✓" ? { background: "linear-gradient(135deg, #1a4a2a, " + portal.accentColor + ")", color: "#fff", border: "none" } : k === "del" ? { fontSize: 16 } : {}
              }, k === "del" ? "⌫" : k);
            });
          })
        )
      );
    }

    // ── Main App ────────────────────────────────────────────────
    function App() {
      const [auth, setAuth] = useState(null); // { role, name, teamId }
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [uploadedFile, setUploadedFile] = useState(null);
      const [showActions, setShowActions] = useState(true);
      const fileRef = useRef();
      const bottomRef = useRef();

      function handleAuth(role, name, teamId) {

        var welcome = role === "admin"
          ? "Welcome, " + name + "! You have full admin access — deals, services, pricing, maps, and forms. What do you need?"

          ? "Hey! I'm your PSD Sales Assistant. I can help with deals, pricing, forms, and more. What do you need?"
          : role === "operations"
          ? "Hey! I'm your PSD Operations Assistant. I can show services, farm maps, and deal summaries. What do you need?"
          : role === "installer"
          ? "Hey! I'm your PSD Assistant. I can show your assigned installations and line items. What do you need?"
          : "Hey! I'm your PSD Analytics Assistant. I can show deals, farm maps, and summaries. What would you like to see?";
        setMessages([{ role: "assistant", content: welcome, display: true }]);
        setShowActions(true);
      }

      useEffect(function() {
        bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      function handleFile(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
          setUploadedFile({ name: file.name, base64: reader.result.split(",")[1] });
        };
        reader.readAsDataURL(file);
      }

      function triggerUpload() { fileRef.current && fileRef.current.click(); }

      function triggerStageSelector() {
        setShowActions(false);
        setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "STAGE_SELECTOR", display: true }]); });
      }

      function triggerServiceStageSelector() {
        setShowActions(false);
        setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "SERVICE_STAGE_SELECTOR", display: true }]); });
      }

      function triggerMapSelector() {
        setShowActions(false);
        setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "MAP_STAGE_SELECTOR", display: true }]); });
      }

      function triggerNewServiceForm() {
        setShowActions(false);
        setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "NEW_SERVICE_FORM", display: true }]); });
      }

      async function sendMessage(overrideText) {
        var text = (overrideText || input).trim();
        if (!text && !uploadedFile) return;
        setShowActions(false);

        // Handle service form submission
        var serviceData = null;
        if (text.startsWith("SUBMIT_SERVICE:")) {
          try { serviceData = JSON.parse(text.replace("SUBMIT_SERVICE:", "")); } catch(e) {}
          text = "Create this service: " + JSON.stringify(serviceData);
        }

        var userContent = uploadedFile
          ? (text ? text + " [Attached: " + uploadedFile.name + "]" : "I have a customer form to submit: " + uploadedFile.name)
          : text;

        var newMsg = { role: "user", content: userContent, display: true };
        var updatedMessages = messages.concat([newMsg]);
        setMessages(updatedMessages);
        setInput("");
        setLoading(true);

        var apiMessages = updatedMessages.filter(function(m) {
          return m.display
            && m.content !== "SHOW_OPTIONS"
            && m.content !== "STAGE_SELECTOR"
            && m.content !== "SERVICE_STAGE_SELECTOR"
            && m.content !== "MAP_STAGE_SELECTOR"
            && m.content !== "ADD_LINE_ITEM_FORM"
            && m.content !== "NEW_SERVICE_FORM"
            && !m.content.startsWith("SERVICE_FORM:")
            && !m.isToolCall
            && !m.isToolResult;
        }).map(function(m) { return { role: m.role, content: m.content }; });

        if (uploadedFile) {
          apiMessages = apiMessages.map(function(m, i) {
            return i === apiMessages.length - 1 ? Object.assign({}, m, { content: m.content + "\n\n[FILE_DATA: base64=" + uploadedFile.base64 + " file_name=" + uploadedFile.name + "]" }) : m;
          });
        }

        try {
          var iterMessages = apiMessages.slice();
          var finalResponse = "";
          for (var i = 0; i < 10; i++) {
            var response = await callClaude(iterMessages, auth.role, auth.teamId);
            var toolCall = null;
            try {
              var trimmed = response.trim();
              var jsonMatch = trimmed.match(/\{[\s\S]*"tool"[\s\S]*\}/);
              if (jsonMatch) toolCall = JSON.parse(jsonMatch[0]);
            } catch(e) {}

            if (toolCall) {
              setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "Calling " + toolCall.tool.replace(/_/g, " ") + "...", display: true, isThinking: true }]); });
              var toolResult;
              try { toolResult = await executeTool(toolCall.tool, toolCall.params); }
              catch(err) { toolResult = { error: err.message }; }
              setMessages(function(prev) { return prev.filter(function(m) { return !m.isThinking; }); });
              iterMessages = iterMessages.concat([
                { role: "assistant", content: response },
                { role: "user", content: "Tool result for " + toolCall.tool + " (use this data to build your display output — do NOT echo this JSON or the tool call in your response): " + JSON.stringify(toolResult) }
              ]);
            } else {
              finalResponse = response;
              break;
            }
          }
          if (finalResponse) {
            // Strip any leaked tool-call JSON that Claude may have prepended
            var cleaned = finalResponse.replace(/^\s*\{[\s\S]*?"tool"[\s\S]*?\}\s*/g, '').replace(/^\s*\{[\s\S]*?"deals"[\s\S]*?\}\s*/, '').trim();
            setMessages(function(prev) { return prev.concat([{ role: "assistant", content: cleaned, display: true }]); });
          }
        } catch(err) {
          setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "Something went wrong: " + err.message, display: true }]); });
        }

        setUploadedFile(null);
        if (fileRef.current) fileRef.current.value = "";
        setLoading(false);
      }

      function handleKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

      if (!auth) return React.createElement(PinScreen, { onAuth: handleAuth });

      var displayMessages = messages.filter(function(m) { return m.display; });

      return React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#0f1923" } },

        // Header
        React.createElement("div", { style: { position: "relative", display: "flex", alignItems: "center", justifyContent: "center", padding: "12px 16px", borderBottom: "1px solid #1e2d3d", background: "#0d1520", flexShrink: 0 } },
          // Left — Lock button
          React.createElement("div", { style: { position: "absolute", left: 12, display: "flex", gap: 6 } },
            React.createElement("button", {
              onClick: function() { setAuth(null); setMessages([]); },
              style: { padding: "6px 12px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 8, color: "#6b8fa8", fontSize: 11, cursor: "pointer" }
            }, "🔒")
          ),
          // Center — Logo + Title
          React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
            React.createElement("div", { style: { width: 32, height: 32, borderRadius: 8, background: "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontWeight: 700, color: "#fff", flexShrink: 0 } }, "P"),
            React.createElement("div", { style: { textAlign: "center" } },
              React.createElement("div", { style: { fontWeight: 700, fontSize: 14, lineHeight: 1.2 } }, getPortalConfig().title),
              React.createElement("div", { style: { fontSize: 10, color: "#4a9a6b", marginTop: 2 } }, "● " + auth.name + " — " + (auth.role.charAt(0).toUpperCase() + auth.role.slice(1)))
            )
          ),
          // Right — Options button
          React.createElement("div", { style: { position: "absolute", right: 12, display: "flex", gap: 6 } },
            React.createElement("button", {
              onClick: function() {
                setShowActions(true);
                setMessages(function(prev) { return prev.concat([{ role: "assistant", content: "SHOW_OPTIONS", display: true }]); });
              },
              style: { padding: "6px 12px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 8, color: "#8ab4cc", fontSize: 11, cursor: "pointer" }
            }, "⚡ Options")
          )
        ),

        // Messages
        React.createElement("div", { style: { flex: 1, overflowY: "auto", padding: "20px 16px", display: "flex", flexDirection: "column", gap: 14 } },
          displayMessages.map(function(msg, i) {
            var isLast = i === displayMessages.length - 1;
            var lastContent = displayMessages[displayMessages.length - 1] && displayMessages[displayMessages.length - 1].content;
            var lastIsSelector = ["SHOW_OPTIONS","STAGE_SELECTOR","SERVICE_STAGE_SELECTOR","MAP_STAGE_SELECTOR","ADD_LINE_ITEM_FORM","NEW_SERVICE_FORM"].indexOf(lastContent) !== -1
              || (lastContent && lastContent.startsWith("SERVICE_FORM:"));
            return React.createElement("div", { key: i },
              React.createElement("div", { style: { display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start" } },
                msg.role === "assistant" && React.createElement("div", { style: { width: 26, height: 26, borderRadius: 7, flexShrink: 0, background: msg.isThinking ? "linear-gradient(135deg, #1a4a6b, #256a9a)" : "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, color: "#fff", marginRight: 9, marginTop: 2 } }, msg.isThinking ? "⚙" : "P"),
                React.createElement("div", { style: { maxWidth: "82%", padding: "9px 13px", borderRadius: msg.role === "user" ? "15px 15px 4px 15px" : "15px 15px 15px 4px", background: msg.role === "user" ? "#1a6b3c" : msg.isThinking ? "#0d1f2d" : "#162130", fontSize: 13, lineHeight: 1.6, color: msg.isThinking ? "#6b8fa8" : "#e8edf2", border: msg.role === "user" ? "none" : "1px solid #1e2d3d", fontStyle: msg.isThinking ? "italic" : "normal" } },
                  msg.isThinking ? msg.content : React.createElement(MessageContent, { content: msg.content, onAction: sendMessage, onUpload: triggerUpload, onStageSelector: triggerStageSelector, onServiceStageSelector: triggerServiceStageSelector, onMapSelector: triggerMapSelector, onNewServiceForm: triggerNewServiceForm, role: auth.role })
                )
              ),
              msg.role === "assistant" && isLast && showActions && !msg.isThinking && !lastIsSelector &&
                React.createElement("div", { style: { marginLeft: 35, marginTop: 8 } },
                  React.createElement(QuickActions, { onAction: sendMessage, onUpload: triggerUpload, onStageSelector: triggerStageSelector, onServiceStageSelector: triggerServiceStageSelector, onMapSelector: triggerMapSelector, onNewServiceForm: triggerNewServiceForm, role: auth.role })
                )
            );
          }),
          loading && !messages.some(function(m) { return m.isThinking; }) &&
            React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 9 } },
              React.createElement("div", { style: { width: 26, height: 26, borderRadius: 7, background: "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, color: "#fff" } }, "P"),
              React.createElement("div", { style: { display: "flex", gap: 5, padding: "9px 13px", background: "#162130", borderRadius: "15px 15px 15px 4px", border: "1px solid #1e2d3d" } },
                [0,1,2].map(function(j) { return React.createElement("div", { key: j, style: { width: 7, height: 7, borderRadius: "50%", background: "#25a35a", animation: "bounce 1.2s infinite", animationDelay: (j * 0.2) + "s" } }); })
              )
            ),
          React.createElement("div", { ref: bottomRef })
        ),

        // File preview
        uploadedFile && React.createElement("div", { style: { margin: "0 16px 8px", padding: "7px 12px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12 } },
          React.createElement("span", null, "📎 " + uploadedFile.name),
          React.createElement("button", { onClick: function() { setUploadedFile(null); }, style: { background: "none", border: "none", color: "#e05252", cursor: "pointer", fontSize: 15 } }, "×")
        ),

        // Input
        React.createElement("div", { style: { padding: "10px 16px 18px", borderTop: "1px solid #1e2d3d", background: "#0d1520", display: "flex", gap: 9, alignItems: "flex-end" } },
          (auth.role === "sales" || auth.role === "admin") && React.createElement("button", { onClick: triggerUpload, style: { width: 38, height: 38, borderRadius: 9, border: "1px solid #1e2d3d", background: uploadedFile ? "#1a6b3c" : "#162130", color: uploadedFile ? "#fff" : "#6b8fa8", cursor: "pointer", fontSize: 17, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } }, "📎"),
          React.createElement("input", { ref: fileRef, type: "file", accept: ".pdf,image/*", onChange: handleFile, style: { display: "none" } }),
          React.createElement("textarea", {
            value: input,
            onChange: function(e) { setInput(e.target.value); },
            onKeyDown: handleKey,
            placeholder: "Ask me anything...",
            rows: 1,
            style: { flex: 1, resize: "none", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 11, padding: "9px 13px", color: "#e8edf2", fontSize: 13, lineHeight: 1.5, outline: "none", fontFamily: "inherit", maxHeight: 120, overflowY: "auto" }
          }),
          React.createElement("button", {
            onClick: function() { sendMessage(); },
            disabled: loading || (!input.trim() && !uploadedFile),
            style: { width: 38, height: 38, borderRadius: 9, border: "none", background: loading || (!input.trim() && !uploadedFile) ? "#162130" : "linear-gradient(135deg, #1a6b3c, #25a35a)", color: loading || (!input.trim() && !uploadedFile) ? "#3a5a70" : "#fff", cursor: loading || (!input.trim() && !uploadedFile) ? "not-allowed" : "pointer", fontSize: 17, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }
          }, "➤")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
