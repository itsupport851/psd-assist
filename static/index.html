<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD Sales Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1923; font-family: 'Inter', system-ui, sans-serif; color: #e8edf2; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 3px; }
    textarea::placeholder { color: #3a5a70; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    .deal-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .deal-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .deal-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; }
    .deal-table tr:last-child td { border-bottom: none; }
    .deal-table tr:hover td { background: #1a2535; cursor: pointer; }
    .line-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .line-table th { background: #1e2d3d; color: #8ab4cc; padding: 7px 10px; text-align: left; font-weight: 600; }
    .line-table td { padding: 7px 10px; border-bottom: 1px solid #1a2535; }
    .line-table tr:last-child td { border-bottom: none; }
    .line-table .total-row td { border-top: 2px solid #25a35a; font-weight: 700; color: #25a35a; background: #0d1f15; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .tag-scheduled { background: #1a3a5c; color: #5ab4f0; }
    .tag-won { background: #0d3320; color: #25a35a; }
    .map-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: linear-gradient(135deg, #1a6b3c, #25a35a); border-radius: 10px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; margin-top: 8px; }
    .map-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const MAKE_READ_WEBHOOK = "https://hook.us2.make.com/fbf052s9udk8xv3apxgct1xiptjqfi7s";
    const MAKE_UPDATE_WEBHOOK = "https://hook.us2.make.com/bew0u14lqrsqvc5mgil8s9bjq92an4eo";
    const MAKE_INTAKE_WEBHOOK = "https://hook.us2.make.com/tl8ovivxtbwxq3rwrifg6lhgyn5f6es6";
    const MAP_URL = "https://web-production-0b9c8.up.railway.app/map";

    const SYSTEM_PROMPT = [
      "You are PSD Sales Assistant, an AI agent for Precision Systems Development (PSD) — a contractor that installs exhaust fan motors on poultry farms under Georgia Power's Commercial Energy Efficiency Program (CEEP).",
      "",
      "You help the sales team with:",
      "1. Submit customer intake forms (PDF or screenshot) to kick off the processing pipeline",
      "2. View and update HubSpot deals and line items (fan motor pricing)",
      "3. Show farm locations on a map for scheduling and cluster analysis",
      "",
      "You have access to these tools:",
      "- get_open_deals: fetch all open deals from HubSpot",
      "- get_line_items: fetch line items for a specific deal (requires deal_id)",
      "- update_line_item: update unit price on a line item (requires line_item_id, unit_price)",
      "- update_deal_amount: update the total amount on a deal (requires deal_id, amount)",
      "- submit_form: submit a customer PDF form (requires file_data as base64, file_name, customer_name, email)",
      "- get_deals_with_addresses: fetch all appointmentscheduled deals with farm addresses — use when asked about farm locations, clusters, distance, scheduling routes, or map",
      "",
      "CRITICAL ID RULES:",
      "The HubSpot data returns deals like: {id: 339921027805, properties: {dealname: 'Henderson Broiler Farm - GP 4423019876'}}",
      "- The deal ID is ALWAYS the top-level id field (e.g. 339921027805)",
      "- The GP account number (e.g. 4423019876) is inside the deal name — NOT the deal ID",
      "- NEVER use GP account number or list position as deal ID",
      "",
      "Line items: {id: 335654673094, properties: {name: 'Chore-Time 48in', quantity: 24, price: 0}}",
      "- Line item ID is ALWAYS the top-level id field",
      "",
      "When updating prices:",
      "1. Fetch line items first",
      "2. Update each line item using correct line_item_id",
      "3. Calculate total: sum of (quantity x unit_price) for ALL items",
      "4. Update deal amount with correct deal_id",
      "5. Confirm to sales person",
      "",
      "When displaying deals use: DEALS_TABLE:{\"deals\":[{\"id\":\"339921027805\",\"name\":\"Henderson Broiler Farm\",\"amount\":0,\"stage\":\"appointmentscheduled\"}]}",
      "When displaying line items use: LINE_ITEMS_TABLE:{\"deal_name\":\"Farm\",\"deal_id\":\"123\",\"items\":[{\"id\":\"456\",\"name\":\"Fan\",\"brand\":\"Chore-Time\",\"size\":48,\"qty\":24,\"unit_price\":0,\"line_total\":0}]}",
      "When showing map use: MAP_LINK after summarizing the farms found",
      "",
      "Tool call format — respond with ONLY this JSON (no other text):",
      "{\"tool\": \"get_open_deals\", \"params\": {}}",
      "{\"tool\": \"get_line_items\", \"params\": {\"deal_id\": \"339921027805\"}}",
      "{\"tool\": \"update_line_item\", \"params\": {\"line_item_id\": \"335654673094\", \"unit_price\": 450}}",
      "{\"tool\": \"update_deal_amount\", \"params\": {\"deal_id\": \"339921027805\", \"amount\": 9000}}",
      "{\"tool\": \"submit_form\", \"params\": {\"file_data\": \"base64\", \"file_name\": \"form.pdf\", \"customer_name\": \"Farm\", \"email\": \"email@farm.com\"}}",
      "{\"tool\": \"get_deals_with_addresses\", \"params\": {}}",
      "",
      "After tool result, respond naturally. For get_deals_with_addresses, summarize farms found then end with exactly: MAP_LINK",
      "Always be concise and professional. Speak like a helpful colleague."
    ].join("\n");

    async function callMakeViaProxy(makeUrl, payload) {
      const res = await fetch('/proxy', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: makeUrl, payload }),
      });
      if (!res.ok) throw new Error("Proxy error: " + res.status);
      try { return await res.json(); } catch { return { success: true }; }
    }

    async function executeTool(tool, params) {
      if (tool === "get_open_deals")
        return await callMakeViaProxy(MAKE_READ_WEBHOOK, { action: "get_open_deals" });
      if (tool === "get_line_items")
        return await callMakeViaProxy(MAKE_READ_WEBHOOK, { action: "get_line_items", deal_id: params.deal_id });
      if (tool === "update_line_item")
        return await callMakeViaProxy(MAKE_UPDATE_WEBHOOK, { action: "update_line_item", line_item_id: params.line_item_id, unit_price: params.unit_price });
      if (tool === "update_deal_amount")
        return await callMakeViaProxy(MAKE_UPDATE_WEBHOOK, { action: "update_deal_amount", deal_id: params.deal_id, amount: params.amount });
      if (tool === "submit_form")
        return await callMakeViaProxy(MAKE_INTAKE_WEBHOOK, params);
      if (tool === "get_deals_with_addresses")
        return await callMakeViaProxy(MAKE_READ_WEBHOOK, { action: "get_deals_with_addresses" });
      throw new Error("Unknown tool: " + tool);
    }

    async function callClaude(messages) {
      const res = await fetch('/claude', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          system: SYSTEM_PROMPT,
          messages,
        }),
      });
      const data = await res.json();
      return data.content && data.content[0] ? data.content[0].text : "";
    }

    function fmt(n) {
      if (n === null || n === undefined || n === "") return "—";
      return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function DealsTable({ data }) {
      const stageLabel = function(s) {
        var map = { appointmentscheduled: "Scheduled", closedwon: "Won", closedlost: "Lost", qualifiedtobuy: "Qualified" };
        return map[s] || s;
      };
      return (
        React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 12, color: "#6b8fa8", marginBottom: 6 } }, data.deals.length + " open deals"),
          React.createElement("table", { className: "deal-table" },
            React.createElement("thead", null,
              React.createElement("tr", null,
                React.createElement("th", null, "#"),
                React.createElement("th", null, "Deal Name"),
                React.createElement("th", null, "Amount"),
                React.createElement("th", null, "Stage")
              )
            ),
            React.createElement("tbody", null,
              data.deals.map(function(d, i) {
                return React.createElement("tr", { key: d.id },
                  React.createElement("td", { style: { color: "#6b8fa8" } }, i + 1),
                  React.createElement("td", { style: { fontWeight: 500 } }, d.name),
                  React.createElement("td", null, fmt(d.amount)),
                  React.createElement("td", null,
                    React.createElement("span", { className: "tag tag-scheduled" }, stageLabel(d.stage))
                  )
                );
              })
            )
          )
        )
      );
    }

    function LineItemsTable({ data }) {
      var total = data.items.reduce(function(sum, item) {
        return sum + (Number(item.qty) * Number(item.unit_price || 0));
      }, 0);
      return (
        React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 12, color: "#6b8fa8", marginBottom: 6 } }, data.deal_name + " — " + data.items.length + " line items"),
          React.createElement("table", { className: "line-table" },
            React.createElement("thead", null,
              React.createElement("tr", null,
                React.createElement("th", null, "Fan"),
                React.createElement("th", null, "Size"),
                React.createElement("th", null, "Qty"),
                React.createElement("th", null, "Unit Price"),
                React.createElement("th", null, "Line Total")
              )
            ),
            React.createElement("tbody", null,
              data.items.map(function(item, i) {
                return React.createElement("tr", { key: item.id || i },
                  React.createElement("td", { style: { fontWeight: 500 } }, item.brand),
                  React.createElement("td", null, item.size + '"'),
                  React.createElement("td", null, item.qty),
                  React.createElement("td", null, fmt(item.unit_price)),
                  React.createElement("td", null, fmt(Number(item.qty) * Number(item.unit_price || 0)))
                );
              }),
              React.createElement("tr", { className: "total-row" },
                React.createElement("td", { colSpan: 4, style: { textAlign: "right" } }, "Total Contract Value"),
                React.createElement("td", null, fmt(total))
              )
            )
          )
        )
      );
    }

    function MessageContent({ content }) {
      if (content.includes("DEALS_TABLE:")) {
        var parts = content.split("DEALS_TABLE:");
        try {
          var jsonStr = parts[1].trim().split("\n")[0];
          var data = JSON.parse(jsonStr);
          return React.createElement("div", null,
            parts[0] && React.createElement("div", { style: { marginBottom: 8 } }, parts[0].trim()),
            React.createElement(DealsTable, { data: data }),
            parts[2] && React.createElement("div", { style: { marginTop: 8 } }, parts[2].trim())
          );
        } catch(e) {
          return React.createElement("div", { style: { whiteSpace: "pre-wrap" } }, content);
        }
      }

      if (content.includes("LINE_ITEMS_TABLE:")) {
        var parts2 = content.split("LINE_ITEMS_TABLE:");
        try {
          var jsonStr2 = parts2[1].trim().split("\n")[0];
          var data2 = JSON.parse(jsonStr2);
          return React.createElement("div", null,
            parts2[0] && React.createElement("div", { style: { marginBottom: 8 } }, parts2[0].trim()),
            React.createElement(LineItemsTable, { data: data2 }),
            parts2[2] && React.createElement("div", { style: { marginTop: 8 } }, parts2[2].trim())
          );
        } catch(e) {
          return React.createElement("div", { style: { whiteSpace: "pre-wrap" } }, content);
        }
      }

      if (content.includes("MAP_LINK")) {
        var mapParts = content.split("MAP_LINK");
        return React.createElement("div", null,
          mapParts[0] && React.createElement("div", { style: { whiteSpace: "pre-wrap", marginBottom: 12 } }, mapParts[0].trim()),
          React.createElement("a", {
            href: MAP_URL,
            target: "_blank",
            rel: "noopener noreferrer",
            className: "map-btn"
          }, "🗺 Open Farm Map"),
          mapParts[1] && React.createElement("div", { style: { marginTop: 8, whiteSpace: "pre-wrap" } }, mapParts[1].trim())
        );
      }

      return React.createElement("div", { style: { whiteSpace: "pre-wrap", wordBreak: "break-word" } }, content);
    }

    function App() {
      var initialMessages = [{
        role: "assistant",
        content: "Hey! I'm your PSD Sales Assistant. I can help you submit customer forms, check open deals, view line items, update pricing, and show farms on a map. What do you need?",
        display: true,
      }];

      const [messages, setMessages] = useState(initialMessages);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [uploadedFile, setUploadedFile] = useState(null);
      const fileRef = useRef();
      const bottomRef = useRef();

      useEffect(function() {
        bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      function handleFile(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
          var base64 = reader.result.split(",")[1];
          setUploadedFile({ name: file.name, base64: base64, type: file.type });
        };
        reader.readAsDataURL(file);
      }

      async function sendMessage() {
        var text = input.trim();
        if (!text && !uploadedFile) return;

        var userContent = text;
        if (uploadedFile) {
          userContent = text
            ? text + " [Attached: " + uploadedFile.name + "]"
            : "I have a customer form to submit: " + uploadedFile.name;
        }

        var newUserMsg = { role: "user", content: userContent, display: true };
        var updatedMessages = messages.concat([newUserMsg]);
        setMessages(updatedMessages);
        setInput("");
        setLoading(true);

        var apiMessages = updatedMessages
          .filter(function(m) { return m.display; })
          .map(function(m) { return { role: m.role, content: m.content }; });

        if (uploadedFile) {
          apiMessages = apiMessages.map(function(m, i) {
            if (i === apiMessages.length - 1) {
              return Object.assign({}, m, { content: m.content + "\n\n[FILE_DATA: base64=" + uploadedFile.base64 + " file_name=" + uploadedFile.name + "]" });
            }
            return m;
          });
        }

        try {
          var iterMessages = apiMessages.slice();
          var finalResponse = "";

          for (var i = 0; i < 10; i++) {
            var response = await callClaude(iterMessages);
            var toolCall = null;

            try {
              var trimmed = response.trim();
              if (trimmed.charAt(0) === "{" && trimmed.includes('"tool"')) {
                toolCall = JSON.parse(trimmed);
              }
            } catch(e) {}

            if (toolCall) {
              setMessages(function(prev) {
                return prev.concat([{
                  role: "assistant",
                  content: "Calling " + toolCall.tool.replace(/_/g, " ") + "...",
                  display: true,
                  isThinking: true
                }]);
              });

              var toolResult;
              try {
                toolResult = await executeTool(toolCall.tool, toolCall.params);
              } catch(err) {
                toolResult = { error: err.message };
              }

              setMessages(function(prev) { return prev.filter(function(m) { return !m.isThinking; }); });

              iterMessages = iterMessages.concat([
                { role: "assistant", content: response },
                { role: "user", content: "Tool result for " + toolCall.tool + ": " + JSON.stringify(toolResult) }
              ]);
            } else {
              finalResponse = response;
              break;
            }
          }

          if (finalResponse) {
            setMessages(function(prev) {
              return prev.concat([{ role: "assistant", content: finalResponse, display: true }]);
            });
          }
        } catch(err) {
          setMessages(function(prev) {
            return prev.concat([{ role: "assistant", content: "Something went wrong: " + err.message, display: true }]);
          });
        }

        setUploadedFile(null);
        if (fileRef.current) fileRef.current.value = "";
        setLoading(false);
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      var displayMessages = messages.filter(function(m) { return m.display; });

      return (
        React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#0f1923" } },

          React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 12, padding: "16px 24px", borderBottom: "1px solid #1e2d3d", background: "#0d1520" } },
            React.createElement("div", { style: { width: 38, height: 38, borderRadius: 10, background: "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 700, color: "#fff", flexShrink: 0 } }, "P"),
            React.createElement("div", null,
              React.createElement("div", { style: { fontWeight: 600, fontSize: 15 } }, "PSD Sales Assistant"),
              React.createElement("div", { style: { fontSize: 11, color: "#4a9a6b", marginTop: 1 } }, "● Online — Precision Systems Development")
            ),
            React.createElement("a", { href: "/map", target: "_blank", style: { marginLeft: "auto", padding: "7px 14px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 8, color: "#8ab4cc", fontSize: 12, textDecoration: "none" } }, "🗺 Farm Map")
          ),

          React.createElement("div", { style: { flex: 1, overflowY: "auto", padding: "24px 16px", display: "flex", flexDirection: "column", gap: 16 } },
            displayMessages.map(function(msg, i) {
              return React.createElement("div", { key: i, style: { display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start" } },
                msg.role === "assistant" && React.createElement("div", { style: { width: 28, height: 28, borderRadius: 8, flexShrink: 0, background: msg.isThinking ? "linear-gradient(135deg, #1a4a6b, #256a9a)" : "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#fff", marginRight: 10, marginTop: 2 } }, msg.isThinking ? "⚙" : "P"),
                React.createElement("div", { style: { maxWidth: "80%", padding: "10px 14px", borderRadius: msg.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px", background: msg.role === "user" ? "#1a6b3c" : msg.isThinking ? "#0d1f2d" : "#162130", fontSize: 14, lineHeight: 1.6, color: msg.isThinking ? "#6b8fa8" : "#e8edf2", border: msg.role === "user" ? "none" : "1px solid #1e2d3d", fontStyle: msg.isThinking ? "italic" : "normal" } },
                  msg.isThinking ? msg.content : React.createElement(MessageContent, { content: msg.content })
                )
              );
            }),

            loading && !messages.some(function(m) { return m.isThinking; }) &&
              React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
                React.createElement("div", { style: { width: 28, height: 28, borderRadius: 8, background: "linear-gradient(135deg, #1a6b3c, #25a35a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#fff" } }, "P"),
                React.createElement("div", { style: { display: "flex", gap: 5, padding: "10px 14px", background: "#162130", borderRadius: "16px 16px 16px 4px", border: "1px solid #1e2d3d" } },
                  [0,1,2].map(function(j) {
                    return React.createElement("div", { key: j, style: { width: 7, height: 7, borderRadius: "50%", background: "#25a35a", animation: "bounce 1.2s infinite", animationDelay: (j * 0.2) + "s" } });
                  })
                )
              ),
            React.createElement("div", { ref: bottomRef })
          ),

          uploadedFile && React.createElement("div", { style: { margin: "0 16px 8px", padding: "8px 12px", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 13 } },
            React.createElement("span", null, "📎 " + uploadedFile.name),
            React.createElement("button", { onClick: function() { setUploadedFile(null); }, style: { background: "none", border: "none", color: "#e05252", cursor: "pointer", fontSize: 16 } }, "×")
          ),

          React.createElement("div", { style: { padding: "12px 16px 20px", borderTop: "1px solid #1e2d3d", background: "#0d1520", display: "flex", gap: 10, alignItems: "flex-end" } },
            React.createElement("button", { onClick: function() { fileRef.current && fileRef.current.click(); }, style: { width: 40, height: 40, borderRadius: 10, border: "1px solid #1e2d3d", background: uploadedFile ? "#1a6b3c" : "#162130", color: uploadedFile ? "#fff" : "#6b8fa8", cursor: "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } }, "📎"),
            React.createElement("input", { ref: fileRef, type: "file", accept: ".pdf,image/*", onChange: handleFile, style: { display: "none" } }),
            React.createElement("textarea", {
              value: input,
              onChange: function(e) { setInput(e.target.value); },
              onKeyDown: handleKey,
              placeholder: "Ask me anything — show deals, update prices, submit a form, show farm map...",
              rows: 1,
              style: { flex: 1, resize: "none", background: "#162130", border: "1px solid #1e2d3d", borderRadius: 12, padding: "10px 14px", color: "#e8edf2", fontSize: 14, lineHeight: 1.5, outline: "none", fontFamily: "inherit", maxHeight: 120, overflowY: "auto" }
            }),
            React.createElement("button", {
              onClick: sendMessage,
              disabled: loading || (!input.trim() && !uploadedFile),
              style: { width: 40, height: 40, borderRadius: 10, border: "none", background: loading || (!input.trim() && !uploadedFile) ? "#162130" : "linear-gradient(135deg, #1a6b3c, #25a35a)", color: loading || (!input.trim() && !uploadedFile) ? "#3a5a70" : "#fff", cursor: loading || (!input.trim() && !uploadedFile) ? "not-allowed" : "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }
            }, "➤")
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
